/* T, HEX, BLOCKS, TABS, PALETTE dependen todos del tema activo. Son "let" (no "const") y se reconstruyen
   entera vía applyTheme() cuando cambia el modo claro/oscuro del sistema — ver el listener en App(). */

function hexToRgba(hex, a) {
  const h = hex.replace("#", "");
  const r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r},${g},${b},${a})`;
}
/* mezcla dos colores hex; t=0 -> hexA puro, t=1 -> hexB puro. Se usa para tonos derivados (p.ej. el morado del FAB
   atenuado hacia el gris oscuro de la barra inferior, sin depender de un color fijo ajeno al tema). */
function mixHex(hexA, hexB, t) {
  const pa = hexA.replace("#", ""), pb = hexB.replace("#", "");
  const ra = parseInt(pa.substring(0, 2), 16), ga = parseInt(pa.substring(2, 4), 16), ba = parseInt(pa.substring(4, 6), 16);
  const rb = parseInt(pb.substring(0, 2), 16), gb = parseInt(pb.substring(2, 4), 16), bb = parseInt(pb.substring(4, 6), 16);
  const r = Math.round(ra + (rb - ra) * t), g = Math.round(ga + (gb - ga) * t), b = Math.round(ba + (bb - ba) * t);
  return `rgb(${r},${g},${b})`;
}

const SEED_BROKERS = ["IBKR"];

function zoneAlpha(base) { return DARK ? Math.min(0.55, base + 0.24) : base; }

/* Modelos que se prueban EN ORDEN si el anterior da 429: cada uno tiene su propio cupo gratuito

const GEMINI_MODELS = ["gemini-2.5-flash", "gemini-2.5-flash-lite"];
const KEY_SNAP = "bloques_snapshots_v1";
const KEY_BROKERS = "bloques_brokers_v1";

const KEY_TR_OLD = "tradecomp_tr_blank_v4"; // migración del Comparador standalone (mismo esquema: tkr/dte/strike/credit/margin)
/* ---------- versión de proyecto: al detectar un update se guarda copia automática de los datos ----------
   REGLA (ampliada): Claude sube APP_VERSION aquí mismo en CUALQUIER entrega que se despliegue — no solo
   cambios de datos/esquema, también UI, cálculos, renombrados, etc. Así "buscar actualización" SIEMPRE
   deja copia de seguridad automática antes de aplicar lo nuevo, sin tener que juzgar caso a caso si el
   cambio "tocaba datos". Formato de dos decimales, sumamos 0.01 por entrega: 4.03, 4.04, 4.05… */
const APP_VERSION = "4.69";
window.APP_VERSION = APP_VERSION;
const KEY_APPVER = "bloques_app_version";

const KEY_FLOWS = "bloques_aportaciones_v1";
const BACKUP_KEYS = [KEY_ACC, KEY_POS, KEY_SNAP, KEY_BROKERS, KEY_TRADES, KEY_BASIS, KEY_VIEW, KEY_FINNHUB, KEY_GEMINI, KEY_FLOWS, "bloques_show_pnl"];
const BASIS_KEYS = ["roi", "annRoi", "rom", "annRom", "impact"];

/* ---------- persistencia ---------- */
const IDB_NAME = "bloques_db_v5", IDB_STORE = "kv";
function idbOpen() {
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open(IDB_NAME, 1);
      r.onupgradeneeded = () => { const db = r.result; if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
}
async function idbSet(key, val) {
  try { const db = await idbOpen(); await new Promise((res, rej) => { const tx = db.transaction(IDB_STORE, "readwrite"); tx.objectStore(IDB_STORE).put(val, key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); } catch (e) {}
}
async function idbGet(key) {
  try { const db = await idbOpen(); return await new Promise((res, rej) => { const tx = db.transaction(IDB_STORE, "readonly"); const rq = tx.objectStore(IDB_STORE).get(key); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }); } catch (e) { return undefined; }
}
function saveKV(key, obj) {
  const s = JSON.stringify(obj);
  try { localStorage.setItem(key, s); } catch (e) {}
  idbSet(key, s);
}

const n = (v) => { if (v === "" || v == null) return 0; const x = Number(String(v).replace(",", ".")); return isNaN(x) ? 0 : x; };
/* evita que al escribir sobre un "0" se quede como "05": quita ceros a la izquierda salvo que formen un decimal (0.5, 0,5) */
const stripLead0 = (s) => s.replace(/^0+(?=\d)/, "");
const factorOf = (p) => (p.factor === "" || p.factor == null ? 1 : n(p.factor));

/* ---------- naturaleza de la posición: gobierna capital desplegado y riesgo plausible ----------
   ACC    Acción                → cap = último × qty            · plausible = cap × factor
   CRED   Crédito (short put,   → cap = BEP × qty               · plausible = cap × factor
          covered call, hybrid collar)
   DEF    Débito / def. riesgo  → cap = riesgo máx (editable,   · plausible = cap (factor 1)
          (long opt, spreads, B3)      def. BEP × qty)
   COLLAR Collar sin riesgo     → cap = último × qty            · plausible = riesgo fijo (editable)
*/
const NATS = [
  { id: "ACC", label: "Acción" },
  { id: "CRED", label: "Crédito" },
  { id: "DEF", label: "Débito" },
  { id: "COLLAR", label: "Collar" },
  { id: "CASH", label: "Cash" },
];
const natsForBlock = (block) => {
  if (block === 0) return [{ id: "ACC", label: "ETF" }, { id: "CASH", label: "Cash" }]; /* B0: liquidez — ETF (treasury/money market) o cash */
  if (block === 1) return NATS.filter((x) => x.id !== "CASH" && x.id !== "DEF"); /* B1: sin estrategias de débito */
  return NATS.filter((x) => x.id !== "COLLAR" && x.id !== "CASH");
};
/* estrategias por bloque (desplegable de la etiqueta p.tipo) */
const STRATS = {
  0: ["Treasury ETF", "Money Market", "Cash"],
  1: ["Long Stock", "Short Put", "Covered Call", "Collar"],
  2: ["Long Stock", "Short Put", "Covered Call", "Diagonal", "DD", "Calendar", "DC", "Iron Condor", "PMCC", "Call Broken Wing", "Put Broken Wing", "Long Call"],
  3: ["Calendar", "DC", "Diagonal", "DD", "Iron Man", "Iron Fly", "Iron Condor"],
};
const natFromStrat = (strat) => {
  const t = (strat || "").toLowerCase();
  if (t === "long stock") return "ACC";
  if (t === "short put" || t === "short call" || t === "covered call") return "CRED";
  if (t === "collar") return "COLLAR";
  if (t === "cash") return "CASH";
  if (t.includes("etf") || t.includes("money")) return "ACC";
  return "DEF";
};
const inferNat = (p) => {
  const t = (p.tipo || "").toLowerCase();
  if (p.block === 0) return "ACC";
  if (t.includes("stock") || t.includes("acci")) return "ACC";
  if (t.includes("collar")) return "COLLAR";
  if (t.includes("short put") || t.includes("covered")) return "CRED";
  return "DEF";
};
const natOf = (p) => p.nat || inferNat(p);
const isCashNat = (p) => natOf(p) === "CASH";
const isOptionNat = (p) => { const x = natOf(p); return x !== "ACC" && x !== "CASH"; };
const contractsOf = (p) => n(p.qty) / 100;
/* BEP automático por prima: cualquier posición de Tipo "Crédito" (short put, covered call, hybrid collar) cobra prima → BEP = Strike − Prima.
   Se basa en "nat" (Tipo), no en el texto de Estrategia, para que funcione siempre que el Tipo sea Crédito, se haya elegido la estrategia como se haya elegido.
   "Long Call" es la única estrategia de débito con esta fórmula simple (Strike + Prima); el resto de nat=Débito son multi-pata y llevan BEP manual.
   Se conserva "Long Call Leaps" (nombre anterior) para no romper el BEP de posiciones ya guardadas con ese tipo. */
const BEP_DEBIT_STRATS = new Set(["Long Call", "Long Call Leaps"]);
const bepAutoStrat = (p) => (natOf(p) === "CRED" ? "CREDIT" : BEP_DEBIT_STRATS.has(p.tipo) ? "DEBIT" : null);
/* PMCC (diagonal débito): la pata CORTA es la posición principal (nat=Crédito, right=C) y se rola/registra
   exactamente como cualquier short call — sus rolls acumulan crédito en p.prima. La pata LARGA (call comprada)
   se guarda en p.long = { strike, expiry, prima }. El "BEP" del PMCC no es un precio: es el DÉBITO NETO por
   acción = prima pagada por la long − prima (acumulada) cobrada por la short. El riesgo = ese débito neto × qty
   (mínimo 0: si se ha cobrado más de lo pagado, ya no hay riesgo). */
const isPMCC = (p) => (p.tipo || "").toLowerCase() === "pmcc";
const pmccNetDebit = (p) => n((p.long || {}).prima) - n(p.prima); // por acción; baja según acumula la short
const pmccRisk = (p) => Math.max(0, pmccNetDebit(p)) * n(p.qty);
const effBep = (p) => {
  if (isPMCC(p)) return pmccNetDebit(p);
  const s = bepAutoStrat(p);
  if (s === "CREDIT") return n(p.strike) - n(p.prima);
  if (s === "DEBIT") return n(p.strike) + n(p.prima);
  return n(p.bep);
};
/* Long Call (débito de una pata): su riesgo es SIEMPRE el 100% de la prima pagada = prima × qty.

   (2000-3000px) que van mucho más allá de lo que hace falta para leer texto de una app de bróker.
   Seguimos usando PNG (sin pérdida) para no meter artefactos de compresión que compliquen leer el texto.
   Si algo falla (navegador raro, archivo corrupto…) caemos de vuelta al fichero original sin redimensionar. */

function resizeImageToBase64(file, maxDim) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);

    img.onload = () => {
      try {
        const { width, height } = img;
        const scale = Math.min(1, maxDim / Math.max(width, height));
        const w = Math.max(1, Math.round(width * scale));
        const h = Math.max(1, Math.round(height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL("image/png");
        URL.revokeObjectURL(url);

      } catch (e) { URL.revokeObjectURL(url); reject(e); }

    { to: p3, color: "rgba(27,163,76,0.20)" },

/* ---------- donut chart interactivo, sin recorte ---------- */
function Donut({ slices, size, thickness, selected, onSelect }) {
  const pad = 6; // margen reservado para el grosor extra al seleccionar
  const total = slices.reduce((s, x) => s + x.value, 0) || 1;
  const r = (size - thickness - pad) / 2;
  const c = 2 * Math.PI * r;
  let offset = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ overflow: "visible" }}>
      <g transform={`rotate(-90 ${size / 2} ${size / 2})`}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={T.tile} strokeWidth={thickness} />
        {slices.map((s, i) => {
          const frac = s.value / total;
          const dash = frac * c;
          const isSel = selected === s.id;
          const dim = selected && !isSel;
          const el = (
            <circle key={i} cx={size / 2} cy={size / 2} r={r} fill="none" stroke={s.color} strokeWidth={isSel ? thickness + pad : thickness}
              strokeDasharray={`${dash} ${c - dash}`} strokeDashoffset={-offset} strokeLinecap="butt"
              opacity={dim ? 0.32 : 1} style={{ cursor: "pointer", transition: "opacity .15s, stroke-width .15s" }}
              onClick={() => onSelect(isSel ? null : s.id)} />
          );
          offset += dash;
          return el;
        })}
      </g>
    </svg>
  );
}

  const toggleRow = (exp) => setExpanded((s) => { const next = new Set(s); if (next.has(exp)) next.delete(exp); else next.add(exp); return next; });
  return (
    <div style={{ background: T.card, borderRadius: 24, padding: 16, boxShadow: T.shadow, marginBottom: 14 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 5, marginBottom: 12 }}>
        <div style={{ fontSize: 15, fontWeight: 800, color: T.ink }}>Vencimientos</div>
        <InfoDot onClick={() => onOpen("vencimientos")} />
      </div>
      {rows.length === 0 ? (
        <div style={{ fontSize: 12.5, color: T.sub, fontWeight: 500 }}>Sin opciones con vencimiento.</div>
      ) : (
        <div style={{ display: "grid", gap: 10 }}>
          {rows.map((row) => {
            const isOpen = expanded.has(row.expiry);
            const dteLabel = row.dte < 0 ? "vencido" : row.dte === 0 ? "hoy" : row.dte + "d";
            return (
              <div key={row.expiry} style={{ borderRadius: 16, background: T.tile, padding: 12 }}>
                <div onClick={() => toggleRow(row.expiry)} style={{ cursor: "pointer" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
                    <span style={{ display: "flex", alignItems: "baseline", gap: 6 }}>
                      <span style={{ fontSize: 15, fontWeight: 800, color: T.ink }}>{longDate(row.expiry)}</span>
                      <span style={{ fontSize: 11.5, fontWeight: 700, color: row.dte <= 7 ? T.red : row.dte <= 30 ? T.gold : T.sub }}>{dteLabel}</span>
                    </span>
                    <span style={{ fontSize: 13, fontWeight: 700, color: T.sub }}>${money(row.riesgo)} riesgo</span>
                  </div>
                </div>
                {isOpen && row.detailRows.length > 0 && (
                  <div style={{ marginTop: 10, paddingTop: 8, borderTop: `1.5px solid ${T.line}`, display: "grid", gap: 3 }}>
                    {row.detailRows.map((d, i) => {
                      const b = BLOCKS.find((x) => x.id === d.block);
                      return (
                        (() => {
                          /* semáforo: short put en peligro si el último cae bajo el strike; short/covered call en
                             peligro si el último sube sobre el strike. Verde en el caso contrario, neutro sin precio. */
                          const lastN = n(d.last), strikeN = n(d.strike);
                          const hasLast = d.last !== "" && d.last != null && isFinite(lastN) && lastN !== 0 && strikeN !== 0;
                          const danger = hasLast && (d.right === "C" ? lastN > strikeN : lastN < strikeN);
                          /* semáforo de asignación por sombreado de fila: rojo suave = strike superado (riesgo de
                             asignación), verde suave = a salvo, sin fondo = sin precio. El texto queda neutro
                             (solo la etiqueta de bloque conserva su color) — un único canal visual, sin ruido. */
                          return (
                        <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 8, padding: "5px 8px", borderRadius: 8, background: !hasLast ? "transparent" : danger ? T.tileRed : T.tileGreen }}>
                          <span style={{ fontSize: 12, color: T.ink, fontWeight: 700, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flex: 1 }}>
                            <span style={{ color: b ? b.color : T.sub, fontWeight: 800 }}>{b ? b.name.replace("Bloque ", "B") : ""}</span>
                            {" · " + d.tkr}
                            {" · x " + d.qtyNum + " "}
                            <span style={{ fontWeight: 800 }}>{strikeStr(d.strike) + (d.right === "C" ? "C" : "P")}</span>
                            {hasLast && <span style={{ fontWeight: 700 }}>{" · Últ $" + money2(lastN)}</span>}
                            {" · BEP $" + money2(d.bep)}
                          </span>
                          <span style={{ fontSize: 12, color: T.sub, fontWeight: 800, flexShrink: 0 }}>{d.covered && !d.riesgo ? "cubierta" : "$" + money(d.riesgo)}</span>
                        </div>
                          );
                        })()
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ---------- gráfico de métrica con ejes, grid y fechas ---------- */
const kFmt = (v) => { const a = Math.abs(v); if (a >= 1e6) return (v / 1e6).toFixed(1) + "M"; if (a >= 1e3) return Math.round(v / 1e3) + "k"; return String(Math.round(v)); };
const shortDate = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("es-ES", { day: "numeric", month: "short" });
function MetricChart({ points, color, axisFmt }) {
  if (points.length < 2) return null;
  const W = 320, H = 150, padL = 44, padR = 12, padT = 10, padB = 22;
  const vs = points.map((p) => p.v);
  let min = Math.min(...vs), max = Math.max(...vs);
  if (min === max) { const d = Math.abs(min) * 0.05 || 1; min -= d; max += d; }
  const span = max - min; min -= span * 0.1; max += span * 0.1;
  const x = (i) => padL + (i / (points.length - 1)) * (W - padL - padR);
  const y = (v) => padT + (1 - (v - min) / (max - min)) * (H - padT - padB);
  const line = points.map((p, i) => `${x(i)},${y(p.v)}`).join(" ");
  const area = `${x(0)},${H - padB} ${line} ${x(points.length - 1)},${H - padB}`;
  const ticks = [0, 1, 2, 3].map((i) => min + ((max - min) * i) / 3);
  const midIdx = points.length >= 3 ? Math.floor((points.length - 1) / 2) : null;
  /* con muchos puntos los círculos se solapan y quedan como una mancha — a partir de cierta densidad
     solo marcamos el último (la línea completa se sigue viendo con todo el detalle). */
  const dense = points.length > 24;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }}>
      {ticks.map((t, i) => (
        <g key={i}>
          <line x1={padL} x2={W - padR} y1={y(t)} y2={y(t)} stroke={T.line} strokeWidth={1} />
          <text x={padL - 6} y={y(t) + 3} textAnchor="end" fontSize={9} fontWeight={600} fill={T.sub}>{axisFmt(t)}</text>
        </g>
      ))}
      <polygon points={area} fill={color} opacity={0.12} />
      <polyline points={line} fill="none" stroke={color} strokeWidth={2.5} strokeLinecap="round" strokeLinejoin="round" />
      {points.map((p, i) => (!dense || i === points.length - 1) && <circle key={i} cx={x(i)} cy={y(p.v)} r={i === points.length - 1 ? 4 : 2.4} fill={i === points.length - 1 ? color : "#fff"} stroke={color} strokeWidth={1.5} />)}
      <text x={x(0)} y={H - 7} textAnchor="start" fontSize={9} fontWeight={600} fill={T.sub}>{shortDate(points[0].date)}</text>
      {midIdx != null && midIdx !== 0 && midIdx !== points.length - 1 && (
        <text x={x(midIdx)} y={H - 7} textAnchor="middle" fontSize={9} fontWeight={600} fill={T.sub}>{shortDate(points[midIdx].date)}</text>
      )}
      <text x={x(points.length - 1)} y={H - 7} textAnchor="end" fontSize={9} fontWeight={600} fill={T.sub}>{shortDate(points[points.length - 1].date)}</text>
    </svg>
  );
}

/* ---------- rendimiento: snapshots fechados con variación ---------- */
const METRICS = {
  "NLV": { get: (s) => s.nlv, fmt: (v) => "$" + money(v), axis: (v) => "$" + kFmt(v), color: T.green },
  "MKT VL": { get: (s) => s.mktvl, fmt: (v) => "$" + money(v), axis: (v) => "$" + kFmt(v), color: T.green },
  "P&L": { get: (s) => s.totalPnl, fmt: (v) => signMoney(v), axis: (v) => "$" + kFmt(v), color: T.purple },
  "Riesgo": { get: (s) => s.totalRiesgo, fmt: (v) => "$" + money(v), axis: (v) => "$" + kFmt(v), color: T.orange },
  "Apalancamiento": { get: (s) => s.leverage, fmt: (v) => (isFinite(v) ? v.toFixed(2) + "×" : "—"), axis: (v) => v.toFixed(2), color: T.purple },
  "EL/Margen": { get: (s) => s.elMrgn, fmt: (v) => pct(v), axis: (v) => Math.round(v * 100) + "%", color: T.gold },
  "EL/NLV": { get: (s) => s.elNlv, fmt: (v) => pct(v), axis: (v) => Math.round(v * 100) + "%", color: T.orange },
};
/* ---------- rangos del gráfico de Rendimiento: filtra qué snapshots se muestran, evita saturación con historial largo ---------- */
const RANGE_DAYS = { "7D": 7, "1M": 30, "3M": 90, "1A": 365 };
const RANGE_KEYS = ["7D", "1M", "3M", "1A", "Todo"];
function rangeCutoffISO(range) {
  if (range === "Todo" || !RANGE_DAYS[range]) return null;
  const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - RANGE_DAYS[range]);
  return d.toISOString().slice(0, 10);
}
function RendimientoCard({ snapshots, flows, onSave, onDelete }) {
  const [expanded, setExpanded] = useState(null);
  const [metric, setMetric] = useState("NLV");
  const [range, setRange] = useState("1M");
  const sorted = [...snapshots].sort((a, b) => (a.date < b.date ? 1 : -1)); // desc
  const first = sorted[sorted.length - 1];
  const asc = [...snapshots].sort((a, b) => (a.date < b.date ? -1 : 1));
  /* aportaciones netas en el intervalo (d0, d1] */
  const flowBetween = (d0, d1) => (flows || []).reduce((s, f) => (f.date > d0 && f.date <= d1 ? s + n(f.amount) : s), 0);
  /* TWR: encadena retornos por tramo, neutralizando aportaciones/retiros (Dietz modificado, flujo a mitad de tramo) */
  const twrSeries = (() => {
    let idx = 100; const out = [];
    asc.forEach((s, i) => {
      if (i === 0) { out.push({ date: s.date, v: 100 }); return; }
      const prev = asc[i - 1];
      const F = flowBetween(prev.date, s.date);
      const denom = prev.nlv + 0.5 * F;
      const r = denom ? (s.nlv - prev.nlv - F) / denom : 0;
      idx *= 1 + r;
      out.push({ date: s.date, v: idx });
    });
    return out;
  })();
  const flowsAsc = [...(flows || [])].sort((a, b) => (a.date < b.date ? -1 : 1));
  const aportSeries = (() => { let acc = 0; return flowsAsc.map((f) => { acc += n(f.amount); return { date: f.date, v: acc }; }); })();
  const SPECIAL = {
    "Rent. real": { series: twrSeries, fmt: (v) => (isFinite(v) ? (v / 100 - 1 >= 0 ? "+" : "") + ((v / 100 - 1) * 100).toFixed(1) + "%" : "—"), axis: (v) => Math.round(v - 100) + "%", color: T.green },
    "Aportado": { series: aportSeries, fmt: (v) => signMoney(v), axis: (v) => "$" + kFmt(v), color: T.purple },
  };
  const METRIC_KEYS = [...Object.keys(METRICS), ...Object.keys(SPECIAL)];
  const sp = SPECIAL[metric];
  const m = sp ? null : METRICS[metric];
  const fullSeries = sp ? sp.series : asc.map((s) => ({ date: s.date, v: m.get(s) })).filter((p) => isFinite(p.v));
  const rangeCutoff = rangeCutoffISO(range);
  const series = rangeCutoff ? fullSeries.filter((p) => p.date >= rangeCutoff) : fullSeries;
  const mFmt = sp ? sp.fmt : m.fmt;
  const mAxis = sp ? sp.axis : m.axis;
  const mColor = sp ? sp.color : m.color;
  const curV = fullSeries.length ? fullSeries[fullSeries.length - 1].v : NaN;
  const firstV = series.length ? series[0].v : NaN;
  const dTotal = curV - firstV;
  const dTotalPct = firstV ? dTotal / Math.abs(firstV) : NaN;
  const isMoney = ["NLV", "MKT VL", "P&L", "Riesgo", "Aportado"].includes(metric);

  return (
    <div style={{ background: T.card, borderRadius: 24, padding: 16, boxShadow: T.shadow, marginBottom: 14 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
        <div style={{ fontSize: 15, fontWeight: 800, color: T.ink }}>Rendimiento</div>
        <button onClick={onSave} style={{ background: T.dark, border: "none", borderRadius: 12, padding: "8px 14px", fontSize: 12.5, fontWeight: 700, color: "#fff", cursor: "pointer" }}>+ Snapshot de hoy</button>
      </div>

      {snapshots.length === 0 && (
        <div style={{ fontSize: 12.5, color: T.sub, fontWeight: 500, padding: "8px 0" }}>Sin snapshots todavía. Guarda uno cada semana o mes para trackear la evolución de NLV, riesgo total y P&L por cuenta, bloque y subyacente a lo largo del tiempo.</div>
      )}

      {snapshots.length >= 1 && (
        <div style={{ marginBottom: 16 }}>
          <div style={{ marginBottom: 8 }}>
            <Pill options={METRIC_KEYS} value={metric} onChange={setMetric} size="sm" />
          </div>
          <div style={{ marginBottom: 8 }}>
            <Pill options={RANGE_KEYS} value={range} onChange={setRange} size="sm" />
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 10 }}>
            <div>
              <div style={{ fontSize: 10.5, color: T.sub, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.4 }}>{metric === "Rent. real" ? "Rentabilidad sin aportaciones (TWR)" : metric === "Aportado" ? "Aportaciones netas acumuladas" : metric + " · último snapshot"}</div>
              <div style={{ fontSize: 24, fontWeight: 800, color: T.ink, letterSpacing: -0.5, marginTop: 1 }}>{isFinite(curV) ? mFmt(curV) : "—"}</div>
            </div>
            {series.length >= 2 && metric !== "Rent. real" && (
              <div style={{ textAlign: "right" }}>
                <div style={{ fontSize: 10.5, color: T.sub, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.4 }}>desde {shortDate(series[0].date)}</div>
                <div style={{ fontSize: 15, fontWeight: 800, color: dTotal >= 0 ? T.green : T.red, marginTop: 1 }}>
                  {isMoney ? signMoney(dTotal) : (dTotal >= 0 ? "+" : "") + mFmt(dTotal).replace("+", "")}{isFinite(dTotalPct) && isMoney ? ` (${dTotalPct >= 0 ? "+" : ""}${(dTotalPct * 100).toFixed(1)}%)` : ""}
                </div>
              </div>
            )}
          </div>
          {series.length >= 2 ? (
            <div style={{ background: T.tile, borderRadius: 16, padding: "12px 10px 8px" }}>
              <MetricChart points={series} color={mColor} axisFmt={mAxis} />
            </div>
          ) : fullSeries.length >= 2 ? (
            <div style={{ fontSize: 11.5, color: T.sub, fontWeight: 500 }}>Sin snapshots en este rango — prueba "Todo" o un rango mayor.</div>
          ) : (
            <div style={{ fontSize: 11.5, color: T.sub, fontWeight: 500 }}>{metric === "Aportado" ? "Registra aportaciones en la pestaña 💶 Aportaciones para ver el acumulado." : "Guarda un segundo snapshot para ver la evolución."}</div>
          )}
        </div>
      )}

      {sorted.map((s, i) => {
        const prev = sorted[i + 1];
        const vsFirst = first && first !== s;
        const dNlv = prev ? s.nlv - prev.nlv : null;
        const dNlvPct = prev && prev.nlv ? dNlv / prev.nlv : NaN;
        const F = prev ? flowBetween(prev.date, s.date) : 0;
        const dReal = prev ? dNlv - F : null;
        const dRealPct = prev && (prev.nlv + 0.5 * F) ? dReal / (prev.nlv + 0.5 * F) : NaN;
        const dPnl = prev ? s.totalPnl - prev.totalPnl : null;
        const dLev = prev && isFinite(s.leverage) && isFinite(prev.leverage) ? s.leverage - prev.leverage : null;
        const isOpen = expanded === s.date;

        let tickerMovers = [];
        if (prev) {
          const allTkrs = new Set([...Object.keys(s.tickers || {}), ...Object.keys(prev.tickers || {})]);
          tickerMovers = [...allTkrs].map((t) => {
            const cur = (s.tickers || {})[t] || { riesgo: 0, pnl: 0 };
            const bef = (prev.tickers || {})[t] || { riesgo: 0, pnl: 0 };
            return { tkr: t, dRiesgo: cur.riesgo - bef.riesgo, dPnl: cur.pnl - bef.pnl };
          }).sort((a, b) => Math.abs(b.dPnl) - Math.abs(a.dPnl)).slice(0, 6);
        }

        return (
          <div key={s.date} style={{ borderTop: `1px solid ${T.line}`, padding: "10px 0" }}>
            <div onClick={() => prev && setExpanded(isOpen ? null : s.date)} style={{ cursor: prev ? "pointer" : "default" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
                <span style={{ fontSize: 14, fontWeight: 800, color: T.ink }}>{new Date(s.date + "T00:00:00").toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" })} {prev && <span style={{ fontSize: 10, color: T.sub, fontWeight: 700 }}>{isOpen ? "▲" : "▼"}</span>}</span>
                <div style={{ display: "flex", alignItems: "baseline", gap: 6 }}>
                  <span style={{ fontSize: 15, fontWeight: 800, color: T.ink }}>${money(s.nlv)}</span>
                  <span style={{ fontSize: 10, color: T.sub, fontWeight: 700 }}>NLV</span>
                  <button onClick={(e) => { e.stopPropagation(); onDelete(s.date); }} style={{ background: "transparent", border: "none", color: T.red, fontSize: 12, fontWeight: 700, cursor: "pointer", padding: "2px 4px" }}>✕</button>
                </div>
              </div>
              <div style={{ display: "flex", gap: 12, marginTop: 6, flexWrap: "wrap" }}>
                <MicroStat label="Riesgo" value={"$" + money(s.totalRiesgo)} />
                <MicroStat label="P&L" value={signMoney(s.totalPnl)} color={s.totalPnl >= 0 ? T.green : T.red} />
                <MicroStat label="Apal." value={isFinite(s.leverage) ? s.leverage.toFixed(2) + "×" : "—"} />
                <MicroStat label="EL/NLV" value={pct(s.elNlv)} />
              </div>
            </div>
            {prev && (
              <div style={{ display: "flex", gap: 12, marginTop: 7, flexWrap: "wrap", background: T.tile, borderRadius: 12, padding: "7px 10px" }}>
                <MicroStat label="Δ NLV" value={signMoney(dNlv) + (isFinite(dNlvPct) ? " (" + (dNlvPct >= 0 ? "+" : "") + (dNlvPct * 100).toFixed(1) + "%)" : "")} color={dNlv >= 0 ? T.green : T.red} />
                {F !== 0 && <MicroStat label="Aport." value={signMoney(F)} color={T.purple} />}
                {F !== 0 && <MicroStat label="Δ Real" value={signMoney(dReal) + (isFinite(dRealPct) ? " (" + (dRealPct >= 0 ? "+" : "") + (dRealPct * 100).toFixed(1) + "%)" : "")} color={dReal >= 0 ? T.green : T.red} />}
                <MicroStat label="Δ P&L" value={signMoney(dPnl)} color={dPnl >= 0 ? T.green : T.red} />
                <MicroStat label="Δ Apal." value={dLev != null ? (dLev >= 0 ? "+" : "") + dLev.toFixed(2) + "×" : "—"} color={dLev != null ? (dLev > 0 ? T.gold : T.green) : T.sub} />
              </div>
            )}
            {!prev && vsFirst && <div style={{ fontSize: 11, color: T.sub, fontWeight: 600, marginTop: 4 }}>Primer snapshot guardado</div>}

            {isOpen && prev && (
              <div style={{ marginTop: 12 }}>
                <div style={{ fontSize: 10.5, color: T.sub, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 6 }}>Por bloque</div>
                <div style={{ display: "grid", gap: 6, marginBottom: 12 }}>
                  {BLOCKS.map((b) => {
                    const cur = s.blocks[b.id] || { riesgo: 0, pnl: 0 };
                    const bef = prev.blocks[b.id] || { riesgo: 0, pnl: 0 };
                    return (
                      <div key={b.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: T.tile, borderRadius: 10, padding: "7px 10px" }}>
                        <span style={{ fontSize: 12, fontWeight: 800, color: b.color }}>{b.name.replace("Bloque ", "B")}</span>
                        <span style={{ fontSize: 11.5, color: T.sub, fontWeight: 600 }}>Riesgo Δ{signMoney(cur.riesgo - bef.riesgo)} · P&L <span style={{ color: cur.pnl - bef.pnl >= 0 ? T.green : T.red, fontWeight: 800 }}>Δ{signMoney(cur.pnl - bef.pnl)}</span></span>
                      </div>
                    );
                  })}
                </div>
                <div style={{ fontSize: 10.5, color: T.sub, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 6 }}>Mayor movimiento por subyacente</div>
                <div style={{ display: "grid", gap: 4 }}>
                  {tickerMovers.map((t) => (
                    <div key={t.tkr} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "4px 2px" }}>
                      <span style={{ fontSize: 12.5, fontWeight: 700, color: T.ink }}>{t.tkr}</span>
                      <span style={{ fontSize: 11.5, color: T.sub, fontWeight: 600 }}>Riesgo Δ{signMoney(t.dRiesgo)} · P&L <span style={{ color: t.dPnl >= 0 ? T.green : T.red, fontWeight: 800 }}>Δ{signMoney(t.dPnl)}</span></span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        );
      })}

      <div style={{ fontSize: 11, color: T.sub, lineHeight: 1.5, marginTop: 12 }}>Cada "🔄 Precios" guarda un snapshot automático del día; el mismo día se sobrescribe, así que el que queda registrado es siempre el último del día. Cada snapshot recoge NLV, MKT VL, riesgo total, plausible, P&L y el detalle por bloque y subyacente de toda la cartera, sin importar el filtro de broker. "Rent. real" es la rentabilidad encadenada por tramos (TWR) descontando las aportaciones y retiros registrados en 💶 Aportaciones (Dietz modificado, flujo ponderado a mitad de tramo) — es la cifra comparable con un índice. Δ Real = Δ NLV − aportaciones netas del tramo. Toca un snapshot con anterior para ver el desglose.</div>
    </div>
  );
}

/* ---------- aportaciones y retiros de cash: no son rendimiento ---------- */
function AportacionesCard({ flows, setFlows, brokers }) {
  const today = new Date().toISOString().slice(0, 10);
  const [date, setDate] = useState(today);
  const [amount, setAmount] = useState("");
  const [kind, setKind] = useState("Aportación");
  const [brk, setBrk] = useState(brokers[0] || "");
  const [note, setNote] = useState("");
  useEffect(() => { if (!brokers.includes(brk)) setBrk(brokers[0] || ""); }, [brokers]);
  const add = () => {
    const a = Math.abs(n(amount));
    if (!a || !date) return;
    const signed = kind === "Retiro" ? -a : a;
    setFlows((fs) => [...fs, { id: newId(), date, amount: String(signed), broker: brk, note: note.trim() }]);
    setAmount(""); setNote("");
  };
  const del = (id) => setFlows((fs) => fs.filter((f) => f.id !== id));
  const sorted = [...flows].sort((a, b) => (a.date < b.date ? 1 : -1));
  const totalIn = flows.reduce((s, f) => s + Math.max(0, n(f.amount)), 0);
  const totalOut = flows.reduce((s, f) => s + Math.min(0, n(f.amount)), 0);
  const neto = totalIn + totalOut;
  const cumSeries = (() => { let acc = 0; return [...flows].sort((a, b) => (a.date < b.date ? -1 : 1)).map((f) => { acc += n(f.amount); return { date: f.date, v: acc }; }); })();
  const inputStyle = { width: "100%", boxSizing: "border-box", background: T.tile, border: `1.5px solid ${T.line}`, borderRadius: 12, padding: "10px 12px", fontSize: 14, fontWeight: 600, color: T.ink, outline: "none" };
  return (
    <div style={{ background: T.card, borderRadius: 24, padding: 16, boxShadow: T.shadow, marginBottom: 14 }}>

      <div style={{ display: "flex", gap: 12, marginBottom: 14, flexWrap: "wrap" }}>
        <MicroStat label="Aportado" value={"$" + money(totalIn)} color={T.green} />
        <MicroStat label="Retirado" value={"-$" + money(Math.abs(totalOut))} color={T.red} />
        <MicroStat label="Neto" value={signMoney(neto)} color={neto >= 0 ? T.green : T.red} />
      </div>

      {cumSeries.length >= 2 && (
        <div style={{ background: T.tile, borderRadius: 16, padding: "12px 10px 8px", marginBottom: 14 }}>
          <div style={{ fontSize: 10.5, color: T.sub, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 6, paddingLeft: 4 }}>Aportaciones netas acumuladas</div>
          <MetricChart points={cumSeries} color={T.purple} axisFmt={(v) => "$" + kFmt(v)} />
        </div>
      )}

      <div style={{ background: T.tile, borderRadius: 16, padding: 12, marginBottom: 14 }}>
        <div style={{ marginBottom: 10 }}>
          <Pill options={["Aportación", "Retiro"]} value={kind} onChange={setKind} size="sm" />
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
          <input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={inputStyle} />
          <input type="number" inputMode="decimal" value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="Importe USD" style={inputStyle} />
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 10 }}>
          <select value={brk} onChange={(e) => setBrk(e.target.value)} style={{ ...inputStyle, appearance: "none", WebkitAppearance: "none" }}>
            {brokers.map((b) => <option key={b} value={b}>{b}</option>)}
          </select>
          <input type="text" value={note} onChange={(e) => setNote(e.target.value)} placeholder="Nota (opcional)" style={inputStyle} />
        </div>
        <button onClick={add} style={{ width: "100%", background: kind === "Retiro" ? T.red : T.green, border: "none", borderRadius: 14, padding: "12px 0", fontSize: 14.5, fontWeight: 700, color: "#fff", cursor: "pointer" }}>{kind === "Retiro" ? "− Registrar retiro" : "+ Registrar aportación"}</button>
      </div>

      {sorted.length === 0 && <div style={{ fontSize: 12.5, color: T.sub, fontWeight: 500, padding: "4px 0" }}>Sin movimientos. Registra cada depósito o retirada de cash con su fecha: el Rendimiento los descuenta para que la rentabilidad no se distorsione.</div>}
      {sorted.map((f) => (
        <div key={f.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderTop: `1px solid ${T.line}`, padding: "9px 0" }}>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 13.5, fontWeight: 800, color: T.ink }}>{new Date(f.date + "T00:00:00").toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" })}</div>
            <div style={{ fontSize: 11.5, color: T.sub, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{f.broker}{f.note ? " · " + f.note : ""}</div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 6, flexShrink: 0 }}>
            <span style={{ fontSize: 14.5, fontWeight: 800, color: n(f.amount) >= 0 ? T.green : T.red }}>{signMoney(f.amount)}</span>
            <button onClick={() => del(f.id)} style={{ background: "transparent", border: "none", color: T.red, fontSize: 12, fontWeight: 700, cursor: "pointer", padding: "2px 4px" }}>✕</button>
          </div>
        </div>
      ))}

      <div style={{ fontSize: 11, color: T.sub, lineHeight: 1.5, marginTop: 12 }}>Solo registro para el cálculo de rendimiento: no modifica el cash de la cuenta (ese lo actualizas en la cuenta o con posiciones Cash en B0). Puedes añadir movimientos con fecha pasada; el TWR se recalcula al momento.</div>
    </div>
  );
}

/* ---------- swipe a la izquierda para eliminar ---------- */
function SwipeDelete({ onDelete, disabled, children }) {
  const [dx, setDx] = useState(0);
  const ref = React.useRef({ x: 0, y: 0, drag: null, base: 0 });
  const W = 92;
  /* con disabled (fila expandida en edición o roll) el swipe se desactiva por completo: el panel de roll
     tiene una tabla con scroll horizontal propio y el gesto chocaba con el deslizable de eliminar */
  useEffect(() => { if (disabled && dx !== 0) setDx(0); }, [disabled]);
  const onTouchStart = (e) => { if (disabled) return; const t = e.touches[0]; ref.current = { x: t.clientX, y: t.clientY, drag: null, base: dx }; };
  const onTouchMove = (e) => {
    if (disabled) return;
    const t = e.touches[0]; const r = ref.current;
    const mx = t.clientX - r.x, my = t.clientY - r.y;
    if (r.drag == null) { if (Math.abs(mx) < 8 && Math.abs(my) < 8) return; r.drag = Math.abs(mx) > Math.abs(my) * 1.2; }
    if (!r.drag) return;
    setDx(Math.max(-W, Math.min(0, r.base + mx)));
  };
  const onTouchEnd = () => { ref.current.drag = null; setDx((d) => (d < -W / 2 ? -W : 0)); };
  return (
    <div style={{ position: "relative", overflow: "hidden" }}>
      {!disabled && (
      <div style={{ position: "absolute", top: 0, right: 0, bottom: 0, width: W, display: "flex" }}>
        <button onClick={() => { setDx(0); onDelete(); }} style={{ flex: 1, margin: "10px 0", border: "none", borderRadius: 14, background: T.red, color: "#fff", fontSize: 12.5, fontWeight: 800, cursor: "pointer", opacity: dx < -10 ? 1 : 0, transition: "opacity 0.15s" }}>Eliminar</button>
      </div>
      )}
      <div onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
        onClickCapture={(e) => { if (dx !== 0) { e.stopPropagation(); e.preventDefault(); setDx(0); } }}
        style={{ transform: dx ? `translateX(${dx}px)` : "none", transition: ref.current.drag ? "none" : "transform 0.2s ease", background: T.card, position: "relative" }}>{/* transform solo si hay desplazamiento: un transform permanente rompe el position:fixed de las hojas de roll/cierre (quedaban recortadas dentro de la fila) */}
        {children}
      </div>
    </div>
  );
}

/* ---------- fila de posición ---------- */
/* ---------- Tabla de patas / cadena de rolls: componente compartido. Es exactamente la misma tabla que se
   ve en Movimientos → Estrategias al expandir una posición, y también se muestra dentro del panel de "Rolar"
   para que el histórico completo esté delante al decidir el nuevo strike/expiry. Scroll horizontal en móvil. ---------- */
function RollChainTable({ p }) {
  const chain = p.rollChain || [];
  const rightLabel = p.right === "C" ? "CALL" : "PUT";
  const shortSide = natOf(p) === "CRED"; // corta: apertura = VENTA, recompra = COMPRA
  const q = n(p.qty);
  /* PMCC: el strike de la short no representa el riesgo real de la operación (que es de débito, cubierto
     por la long). La última columna pasa a ser %Riesgo = prima de cada pata / BEP actual del PMCC (débito
     neto por acción), en vez de %Strike. */
  const pmcc = isPMCC(p);
  const retLabel = pmcc ? "%Riesgo" : "%Strike";
  const retDenom = pmcc ? Math.abs(pmccNetDebit(p)) : null;
  const retOf = (perShare, strike) => (pmcc ? (retDenom ? perShare / retDenom : NaN) : (n(strike) ? perShare / n(strike) : NaN));
  const openingPrima = chain.length > 0 ? n(chain[0].prevPrima) : n(p.prima);
  const openingStk = chain.length > 0 ? chain[0].prevStrike : p.strike;
  const openingExp = chain.length > 0 ? chain[0].prevExpiry : p.expiry;
  const stkAfter = (idx) => (idx + 1 < chain.length ? chain[idx + 1].prevStrike : p.strike);
  const expAfter = (idx) => (idx + 1 < chain.length ? chain[idx + 1].prevExpiry : p.expiry);
  const LegRow = ({ date, action, strike, expiry, perShare, amount, fee, ivr, ret, isBuy, isExp }) => {
    const legDays = daysBetween(date, expiry);
    return (
      <div style={{ display: "grid", gridTemplateColumns: "62px 104px 64px 78px 44px 46px 60px 66px 84px 72px", gap: 6, alignItems: "center", padding: "8px 10px", borderRadius: 9, background: T.card, marginBottom: 4, fontVariantNumeric: "tabular-nums" }}>
        <span style={{ fontSize: 12, fontWeight: 700, color: T.sub, whiteSpace: "nowrap" }}>{shortDate(date)}</span>
        <span style={{ fontSize: 12, fontWeight: 800, color: isExp ? T.sub : isBuy ? T.red : T.green, whiteSpace: "nowrap" }}>{action} {rightLabel}</span>
        <span style={{ fontSize: 12.5, fontWeight: 800, color: T.ink, whiteSpace: "nowrap" }}>{strikeStr(strike)}{p.right}</span>
        <span style={{ fontSize: 11.5, fontWeight: 600, color: T.sub, whiteSpace: "nowrap" }}>{expiry ? shortDate(expiry) : "—"}</span>
        <span style={{ fontSize: 11.5, fontWeight: 600, color: T.sub, textAlign: "right", whiteSpace: "nowrap" }}>{isFinite(legDays) ? legDays + "d" : "—"}</span>
        <span style={{ fontSize: 11.5, fontWeight: 600, color: T.sub, textAlign: "right", whiteSpace: "nowrap" }}>{ivr || "—"}</span>
        <span style={{ fontSize: 11.5, fontWeight: 600, color: T.sub, textAlign: "right", whiteSpace: "nowrap" }}>{fee ? "$" + money2(fee) : "—"}</span>
        <span style={{ fontSize: 12.5, fontWeight: 800, color: isExp ? T.sub : isBuy ? T.red : T.green, textAlign: "right", whiteSpace: "nowrap" }}>{isExp ? "$0" : (isBuy ? "-$" : "+$") + money2(Math.abs(perShare))}</span>
        <span style={{ fontSize: 13, fontWeight: 800, color: isExp ? T.sub : isBuy ? T.red : T.green, textAlign: "right", whiteSpace: "nowrap" }}>{isExp ? "$0" : (isBuy ? "-$" : "+$") + money2(Math.abs(amount))}</span>
        <span style={{ fontSize: 11, fontWeight: 700, color: isFinite(ret) ? (ret >= 0 ? T.green : T.red) : T.sub, textAlign: "right", whiteSpace: "nowrap" }}>{isFinite(ret) ? (ret * 100).toFixed(2) + "%" : "—"}</span>
      </div>
    );
  };
  const rows = [];
  const openAmt = openingPrima * q;
  rows.push(<LegRow key="open" date={p.entryDate} action={shortSide ? "VENTA" : "COMPRA"} strike={openingStk} expiry={openingExp} perShare={openingPrima} amount={openAmt} fee={n(p.comision)} ivr={p.ivr} ret={retOf(openingPrima, openingStk)} isBuy={!shortSide} />);
  chain.forEach((r, idx) => {
    const buyAmt = n(r.buybackCost) * q, sellAmt = n(r.newCredit) * q;
    rows.push(<LegRow key={"b" + idx} date={r.date} action={shortSide ? "COMPRA" : "VENTA"} strike={r.prevStrike} expiry={r.prevExpiry} perShare={n(r.buybackCost)} amount={buyAmt} fee={n(r.comision)} isBuy={shortSide} />);
    rows.push(<LegRow key={"s" + idx} date={r.date} action={shortSide ? "VENTA" : "COMPRA"} strike={stkAfter(idx)} expiry={expAfter(idx)} perShare={n(r.newCredit)} amount={sellAmt} ivr={r.ivr} ret={retOf(n(r.newCredit), stkAfter(idx))} isBuy={!shortSide} />);
    if (r.note) rows.push(<div key={"n" + idx} style={{ fontSize: 11.5, color: T.sub, fontStyle: "italic", margin: "0 0 6px 4px", lineHeight: 1.4 }}>💬 {r.note}</div>);
  });
  if (p.closed) {
    const closeAmt = n(p.closePrice) * q;
    const isExp = n(p.closePrice) === 0;
    rows.push(<LegRow key="close" date={p.closeDate} action={isExp ? "EXPIRA" : (shortSide ? "COMPRA" : "VENTA")} strike={p.strike} expiry={p.expiry} perShare={n(p.closePrice)} amount={closeAmt} fee={n(p.closeComision)} isBuy={shortSide && !isExp} isExp={isExp} />);
    if (p.closeNote) rows.push(<div key="cn" style={{ fontSize: 11.5, color: T.sub, fontStyle: "italic", margin: "0 0 4px 4px", lineHeight: 1.4 }}>💬 {p.closeNote}</div>);
  }
  return (
    <div style={{ overflowX: "auto", WebkitOverflowScrolling: "touch", margin: "0 -12px", padding: "0 12px" }}>
      <div style={{ minWidth: 758 }}>{/* 680px de columnas + 54px de gaps + 20px de padding de fila: si no, la última columna (%Strike/%Riesgo) se sale del cuadro */}
        <div style={{ display: "grid", gridTemplateColumns: "62px 104px 64px 78px 44px 46px 60px 66px 84px 72px", gap: 6, padding: "0 10px 4px" }}>
          {["Fecha", "Operación", "Strike", "Expiry", "Días", "IVR", "Fee", "Prima", "Importe", retLabel].map((h, i) => (
            <span key={h} style={{ fontSize: 9.5, fontWeight: 700, color: T.sub, textTransform: "uppercase", letterSpacing: 0.4, textAlign: i >= 4 ? "right" : "left" }}>{h}</span>
          ))}
        </div>
        {rows}
      </div>
    </div>
  );
}

function PositionRow({ p, editing, onToggle, onDone, onChange, onDelete, onRoll, onClose, onReopen, pctBloque, pctCartera, showPnl, brokers, hideBroker, pendingAction, clearPending, onRollingChange, coveredLabel }) {
  const detail = optionDetail(p);
  const nat = natOf(p);
  const cap = capDesplegado(p);
  const plausible = plausibleOf(p);
  const opt = isOptionNat(p);
  const contratos = contractsOf(p);
  const cash = isCashNat(p);
  const qtyNum = opt ? (Number.isInteger(contratos) ? contratos : n(p.qty)) : n(p.qty);
  const qtyUnit = opt ? (Number.isInteger(contratos) ? "contr." : "opc") : "acc";
  const pnlVal = effPnl(p);
  const pnlBasis = Math.abs(effBep(p) * n(p.qty)) || Math.abs(n(p.mktValue)) || cap;
  const pnlPct = pnlBasis ? pnlVal / pnlBasis : NaN;
  const rollChain = p.rollChain || [];
  const canRoll = !!onRoll && !p.closed && opt && natOf(p) === "CRED"; // roll de cadena: solo opciones cortas (Short Put/Short Call, nat=Crédito)
  const canClose = !!onClose && !p.closed && (nat === "ACC" || nat === "COLLAR" || opt); // acciones/collar/cualquier opción se pueden cerrar
  const [rolling, setRolling] = useState(false);
  /* "Avanzado" del editor (valor mercado / margen / P&L): plegado por defecto; abierto de inicio si el
     P&L está en Manual — señal de que la posición no tiene precio autodescargable y ese campo SÍ se usa */
  const [showAdv, setShowAdv] = useState(() => !isAutoPnl(p) || p.mktModo === "MANUAL");
  const [rollDate, setRollDate] = useState("");
  const [rollStrike, setRollStrike] = useState("");
  const [rollExpiry, setRollExpiry] = useState("");
  const [rollBuyback, setRollBuyback] = useState("");
  const [rollCredit, setRollCredit] = useState("");
  const [rollComision, setRollComision] = useState("");
  const [rollIvr, setRollIvr] = useState("");
  const [rollNote, setRollNote] = useState("");
  const openRoll = () => { setRollDate(new Date().toISOString().slice(0, 10)); setRollStrike(p.strike || ""); setRollExpiry(""); setRollBuyback(""); setRollCredit(""); setRollComision(""); setRollIvr(""); setRollNote(""); setRolling(true); };
  const confirmRoll = () => {
    onRoll({ date: rollDate, strike: rollStrike, expiry: rollExpiry, buybackCost: rollBuyback, newCredit: rollCredit, comision: rollComision, ivr: rollIvr, note: rollNote });
    setRolling(false);
  };
  const [closing, setClosing] = useState(false);
  const [closeDateV, setCloseDateV] = useState("");
  const [closePriceV, setClosePriceV] = useState("");
  const [closeComisionV, setCloseComisionV] = useState("");
  const [closeNoteV, setCloseNoteV] = useState("");
  const [closeLongPriceV, setCloseLongPriceV] = useState(""); // PMCC: precio de venta de la pata larga
  const [closeLongComisionV, setCloseLongComisionV] = useState("");
  const openClose = () => { setCloseDateV(new Date().toISOString().slice(0, 10)); setClosePriceV(""); setCloseComisionV(""); setCloseNoteV(""); setCloseLongPriceV(""); setCloseLongComisionV(""); setClosing(true); };
  const confirmClose = () => {
    onClose({ date: closeDateV, price: closePriceV, comision: closeComisionV, note: closeNoteV, longPrice: closeLongPriceV, longComision: closeLongComisionV });
    setClosing(false);
  };
  useEffect(() => {
    if (pendingAction && pendingAction.id === p.id) {
      if (pendingAction.action === "roll") openRoll();
      if (pendingAction.action === "close") openClose();
      clearPending && clearPending();
    }
  }, [pendingAction]);
  /* avisa hacia arriba cuando hay una hoja de roll/cierre abierta (BlockCard desactiva el swipe-eliminar) */
  useEffect(() => { onRollingChange && onRollingChange(rolling || closing); return () => { onRollingChange && onRollingChange(false); }; }, [rolling, closing]);
  return (
    <div style={{ borderTop: `1px solid ${T.line}`, padding: "10px 0" }}>
      {coveredLabel && coveredLabel.length > 0 && natOf(p) === "ACC" && (
        <div style={{ background: T.tilePurple, borderLeft: `3px solid ${T.purple}`, borderRadius: 8, padding: "5px 9px", marginBottom: 7 }}>
          <div style={{ fontSize: 10, fontWeight: 800, color: T.purple, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: coveredLabel.length > 1 ? 3 : 0, display: "flex", alignItems: "center", gap: 6 }}>
            <span>🛡️ {coveredLabel.length === 1 ? (coveredLabel[0].kind === "collar" ? "Collar" : "Covered") : "Cobertura"}</span>
            {coveredLabel.length === 1 && <span style={{ fontSize: 10.5, fontWeight: 700, textTransform: "none", letterSpacing: 0 }}>{coveredLabel[0].kind === "collar" ? coveredLabel[0].label : "call vendida: " + coveredLabel[0].label}</span>}
          </div>
          {coveredLabel.length > 1 && coveredLabel.map((e, i) => (
            <div key={i} style={{ fontSize: 10.5, fontWeight: 700, color: T.purple, lineHeight: 1.5 }}>{(e.kind === "collar" ? "Collar" : "CC") + " · " + e.label}</div>
          ))}
        </div>
      )}
      <div onClick={editing ? onDone : onToggle} style={{ cursor: "pointer" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
          <div style={{ minWidth: 0 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
              <span style={{ fontSize: 15, fontWeight: 800, color: T.ink, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{p.tkr || (cash ? "Cash" : "Sin ticker")}</span>
              {p.tipo && <span style={{ fontSize: 9.5, fontWeight: 800, color: T.sub, background: T.tile, borderRadius: 6, padding: "2px 5px" }}>{p.tipo}</span>}
              {detail && <span style={{ fontSize: 11.5, fontWeight: 600, color: T.sub }}>{detail}</span>}
              {rollChain.length > 0 && <span style={{ fontSize: 9.5, fontWeight: 800, color: T.purple, background: T.tile, borderRadius: 6, padding: "2px 5px" }}>🔄 ×{rollChain.length}</span>}
              {p.closed && <span style={{ fontSize: 9.5, fontWeight: 800, color: T.sub, background: T.tile, borderRadius: 6, padding: "2px 5px" }}>Cerrada</span>}
            </div>
            {!cash && <div style={{ fontSize: 12.5, color: T.sub, fontWeight: 700, marginTop: 3 }}>× {qtyNum} <span style={{ fontWeight: 600, fontSize: 11 }}>{qtyUnit}</span></div>}
          </div>
          <div style={{ textAlign: "right", flexShrink: 0 }}>
            <div style={{ fontSize: 14.5, fontWeight: 800, color: T.ink }}>${money2(cap)}</div>
            <div style={{ fontSize: 11, fontWeight: 700, color: T.sub }}>{pct(pctCartera, 1)} NLV</div>
          </div>
        </div>
        {showPnl && !cash && (
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 7, padding: "6px 10px", borderRadius: 10, background: pnlVal > 0 ? T.tileGreen : pnlVal < 0 ? T.tileRed : T.tile }}>
            <span style={{ fontSize: 10, fontWeight: 700, color: T.sub, textTransform: "uppercase", letterSpacing: 0.4 }}>P&L{isAutoPnl(p) ? "" : " · manual"}</span>
            <span style={{ fontSize: 15, fontWeight: 800, color: pnlVal > 0 ? T.green : pnlVal < 0 ? T.red : T.sub }}>{signMoney(pnlVal)}{isFinite(pnlPct) ? <span style={{ fontSize: 12, fontWeight: 700, marginLeft: 6 }}>{(pnlPct >= 0 ? "+" : "") + (pnlPct * 100).toFixed(1) + "%"}</span> : null}</span>
          </div>
        )}
        {!cash && (
          <div style={{ display: "flex", gap: 8, marginTop: 7, flexWrap: "wrap" }}>
            <MicroStat label="BEP" value={"$" + money2(effBep(p))} />
            <MicroStat label="Último" value={p.last ? "$" + money2(p.last) : "—"} />
            <MicroStat label="% Bloque" value={pct(pctBloque, 1)} />
            <MicroStat label="Plausible" value={"$" + money(plausible)} />
          </div>
        )}
        {cash && (
          <div style={{ display: "flex", gap: 8, marginTop: 7, flexWrap: "wrap" }}>
            <MicroStat label="% Bloque" value={pct(pctBloque, 1)} />
            <MicroStat label="Broker" value={p.broker} />
          </div>
        )}
      </div>

      {editing && !rolling && (
        <div onTouchStart={(e) => e.stopPropagation()} onTouchMove={(e) => e.stopPropagation()} onTouchEnd={(e) => e.stopPropagation()}
          style={{ marginTop: 10, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
          <div style={{ gridColumn: "span 2", display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
            <span style={{ fontSize: 14, fontWeight: 800, color: T.ink }}>✏️ Editar posición</span>
            <span style={{ fontSize: 9.5, fontWeight: 600, color: T.sub }}>se guarda al instante</span>
          </div>
          <EditSection icon="📌" title="Posición" first />
          {!hideBroker && (
          <label>
            <span style={{ display: "block", fontSize: 10, color: T.sub, fontWeight: 600, marginBottom: 3, textTransform: "uppercase", letterSpacing: 0.4 }}>Broker</span>
            <Pill options={brokers} value={p.broker} onChange={onChange("broker")} />
          </label>
          )}
          <EditField label="Ticker" value={p.tkr} onChange={onChange("tkr")} text />
          <div style={{ gridColumn: hideBroker ? "auto" : "span 2" }}>

            style={{ position: "fixed", inset: 0, background: "rgba(20,18,14,0.5)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 60 }}>
            <div onClick={(e) => e.stopPropagation()} style={{ background: T.card, borderRadius: "26px 26px 0 0", padding: "18px 18px 26px", width: "100%", maxWidth: 560, maxHeight: "86vh", overflowY: "auto", boxSizing: "border-box", boxShadow: "0 -10px 40px rgba(0,0,0,0.35)" }}>
              <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 4 }}>
                <div>
                  <div style={{ fontSize: 17, fontWeight: 800, color: T.ink }}>✕ Cerrar {p.tkr}</div>
                  <div style={{ fontSize: 11.5, fontWeight: 600, color: T.sub, marginTop: 2 }}>{pmcc ? "Recompra de la short + venta de la long · por acción" : (opt ? "Precio de recompra" : "Precio de venta") + " · por acción" + (opt ? " · la posición queda archivada con su cadena de rolls" : "")}</div>
                </div>
                <button onClick={() => setClosing(false)} style={{ background: T.tile, border: "none", borderRadius: 12, width: 34, height: 34, fontSize: 15, color: T.sub, cursor: "pointer", flexShrink: 0 }}>✕</button>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 10 }}>
                <WizInput label="Fecha de cierre" value={closeDateV} onChange={setCloseDateV} type="date" />
                <WizInput label={pmcc ? "Recompra short $/acc" : (opt ? "Precio recompra $/acc" : "Precio venta $/acc")} value={closePriceV} onChange={setClosePriceV} placeholder={opt ? "0 si expira sin valor" : "$"} inputMode="decimal" />
                <WizInput label={pmcc ? "Comisión short" : "Comisión de cierre"} value={closeComisionV} onChange={setCloseComisionV} placeholder="$" inputMode="decimal" />
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontSize: 10.5, fontWeight: 700, color: T.sub, textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 5, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>Resultado est.</div>
                  <div style={{ boxSizing: "border-box", height: 47, display: "flex", alignItems: "center", padding: "0 12px", borderRadius: 12, background: isFinite(est) ? (est >= 0 ? T.tileGreen : T.tileRed) : T.tile }}>
                    <span style={{ fontSize: 15.5, fontWeight: 800, color: isFinite(est) ? (est >= 0 ? T.green : T.red) : T.sub, whiteSpace: "nowrap", fontVariantNumeric: "tabular-nums" }}>{isFinite(est) ? signMoney(est) : "—"}</span>
                  </div>
                </div>
                {pmcc && (
                  <>
                    <WizInput label="Venta long $/acc" value={closeLongPriceV} onChange={setCloseLongPriceV} placeholder="0 si expira sin valor" inputMode="decimal" />
                    <WizInput label="Comisión long" value={closeLongComisionV} onChange={setCloseLongComisionV} placeholder="$" inputMode="decimal" />
                  </>
                )}
                <div style={{ gridColumn: "span 2" }}>
                  <WizInput label="Comentario (motivo del cierre)" value={closeNoteV} onChange={setCloseNoteV} />
                </div>
              </div>
              <button onClick={confirmClose} disabled={!ok} style={{ marginTop: 16, width: "100%", background: ok ? T.red : T.tile, border: "none", borderRadius: 14, padding: "15px 0", fontSize: 15, fontWeight: 800, color: ok ? "#fff" : T.sub, cursor: "pointer" }}>Confirmar cierre</button>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

/* ---------- tarjeta de bloque activo ---------- */
function BlockCard({ blk, positions, nlv, editSet, toggleEdit, closeEdits, setPos, addPos, delPos, rollPos, closePos, reopenPos, showPnl, togglePnl, brokers, onOpenSheet, pendingAction, clearPending, coveredMap }) {
  const [rollingIds, setRollingIds] = useState(new Set()); // filas con el panel de roll abierto → swipe-eliminar desactivado
  const activePositions = positions.filter((p) => !p.closed);
  const capBlock = activePositions.reduce((s, p) => s + capDesplegado(p), 0);
  const plausibleBlock = activePositions.reduce((s, p) => s + plausibleOf(p), 0);
  const pnl = activePositions.reduce((s, p) => s + effPnl(p), 0);
  const pctNlv = nlv ? capBlock / nlv : NaN;
  const pctNlvPlausible = nlv ? plausibleBlock / nlv : NaN;
  const zones = bandZones(blk);
  const marks = [{ at: blk.tMin, label: pct(blk.tMin, 0) }, { at: blk.tMax, label: pct(blk.tMax, 0) }];

  return (
    <div style={{ background: T.card, borderRadius: 24, padding: 16, boxShadow: T.shadow, marginBottom: 14 }}>
      <div onClick={closeEdits} style={{ cursor: editSet.size > 0 ? "pointer" : "default" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 12 }}>
          <div style={{ display: "flex", alignItems: "flex-start", gap: 10 }}>
            <div style={{ width: 10, height: 10, borderRadius: 3, background: blk.badge, marginTop: 5, flexShrink: 0 }} />
            <div>
              <div style={{ fontSize: 17, fontWeight: 800, color: T.ink, letterSpacing: -0.3 }}>{blk.name} <span style={{ color: blk.color, fontWeight: 800 }}>· {blk.tag}</span></div>
              <div style={{ fontSize: 12, color: T.sub, fontWeight: 500, marginTop: 1 }}>{blk.desc}</div>
            </div>
          </div>
          <div style={{ background: blk.bg, color: blk.color, borderRadius: 10, padding: "5px 9px", fontSize: 11, fontWeight: 800, whiteSpace: "nowrap", flexShrink: 0 }}>
            Obj {pct(blk.tMin, 0)}–{pct(blk.tMax, 0)}
          </div>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 14 }}>
          {/* B0 es liquidez: su suma no es riesgo, es tamaño — se etiqueta "Total" y no muestra plausible */}
          <MiniStat label={blk.id === 0 ? "Total" : "Riesgo total"} value={"$" + money(capBlock)} color={blk.color} />
          <MiniStat label="% NLV (total)" value={pct(pctNlv)} color={blk.color} />
          {blk.id !== 0 && <MiniStat label="Riesgo plausible" value={"$" + money(plausibleBlock)} />}
          {blk.id !== 0 && <MiniStat label="% NLV (plausible)" value={pct(pctNlvPlausible)} />}
        </div>
        <div style={{ marginBottom: 14 }}><MiniStat label="P&L" value={signMoney(pnl)} color={pnl > 0 ? T.green : pnl < 0 ? T.red : T.sub} /></div>

        <ZoneBar value={pctNlv} min={blk.scaleMin} max={blk.scaleMax} zones={zones} />
        <Scale min={blk.scaleMin} max={blk.scaleMax} marks={marks} />
      </div>

      <div style={{ marginTop: 14 }}>
        {positions.length > 0 && (
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 2 }}>
            <span style={{ fontSize: 11, color: T.sub, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.4 }}>Posiciones</span>
            <button onClick={togglePnl} style={{ background: showPnl ? blk.color : T.tile, border: "none", borderRadius: 10, padding: "5px 12px", fontSize: 11.5, fontWeight: 800, color: showPnl ? "#fff" : T.sub, cursor: "pointer" }}>{showPnl ? "P&L visible" : "Ver P&L"}</button>
          </div>
        )}
        {positions.length === 0 && (
          <div style={{ fontSize: 12.5, color: T.sub, fontWeight: 500, padding: "8px 0" }}>Sin posiciones en este bloque para el broker seleccionado.</div>
        )}
        {positions.map((p) => (
          <SwipeDelete key={p.id} onDelete={() => delPos(p.id)} disabled={editSet.has(p.id) || rollingIds.has(p.id)}>
            <PositionRow p={p} editing={editSet.has(p.id)} onToggle={() => (onOpenSheet ? onOpenSheet(p) : toggleEdit(p.id))} onDone={() => toggleEdit(p.id)}
              pendingAction={pendingAction} clearPending={clearPending}
              onRollingChange={(v) => setRollingIds((s) => { const x = new Set(s); if (v) x.add(p.id); else x.delete(p.id); return x; })}
              coveredLabel={(coveredMap || {})[p.id]}
              onChange={(k) => (v) => setPos(p.id, k, v)} onDelete={() => delPos(p.id)} showPnl={showPnl} brokers={brokers}
              onRoll={(vals) => rollPos(p.id, vals)} onClose={(vals) => closePos(p.id, vals)} onReopen={() => reopenPos(p.id)}
              pctBloque={capBlock ? capDesplegado(p) / capBlock : NaN} pctCartera={nlv ? capDesplegado(p) / nlv : NaN} />
          </SwipeDelete>
        ))}
      </div>

      {/* alta de posiciones: solo vía el FAB verde "+" (asistente Nueva posición) — el botón por bloque se retiró en v4.45 */}
    </div>
  );
}

/* ---------- MOVIMIENTOS: vista de nivel superior. Las posiciones se crean/editan/rolan/cierran desde su
   bloque; aquí solo se reconstruye su historial en tres sub-vistas:
   · Primas — cash de cada evento (apertura, roll neto, cierre). Cierre de opción corta = recompra →
     negativo; expiración sin valor = cierre a precio 0. Cada línea es fecha·ticker·fee·prima y se expande
     al pulsar mostrando strike y P/C. Totales por mes, por año y acumulado.
   · MTM — resultado REALIZADO de cada roll y cierre: precio de entrada de la pata que se cierra vs precio
     de recompra/venta, con su fee visible en cada línea.
   · Estrategias — TODAS las posiciones (abiertas y cerradas) archivadas por tipo: Acciones, Covered
     Calls, Short Puts, PMCC, DC/DD, Otras. Selector Abiertas/Cerradas. Al pulsar una posición se expande
     con: cadena de rolls, prima acumulada, BEP, ROM (prima/riesgo), DTE, DIT e IVR de apertura. ---------- */
function MovimientosView({ positions, reopenPos }) {
  const [sub, setSub] = useState("primas");
  const [stratCat, setStratCat] = useState("Acciones");
  const [stratStatus, setStratStatus] = useState("Abiertas");
  const [expanded, setExpanded] = useState(new Set());
  const toggleExpand = (id) => setExpanded((s) => { const x = new Set(s); x.has(id) ? x.delete(id) : x.add(id); return x; });
  const [openMonths, setOpenMonths] = useState(new Set());
  const toggleMonth = (key) => setOpenMonths((s) => { const x = new Set(s); x.has(key) ? x.delete(key) : x.add(key); return x; });
  const [openYears, setOpenYears] = useState(new Set());
  const toggleYear = (key) => setOpenYears((s) => { const x = new Set(s); x.has(key) ? x.delete(key) : x.add(key); return x; });

  const openingPrimaPerShare = (p) => {
    const chain = p.rollChain || [];
    return chain.length > 0 ? n(chain[0].prevPrima) : n(p.prima);
  };
  const openingStrike = (p) => {
    const chain = p.rollChain || [];
    return chain.length > 0 ? chain[0].prevStrike : p.strike;
  };
  const strikeAfterRoll = (p, idx) => {
    const chain = p.rollChain || [];
    return idx + 1 < chain.length ? chain[idx + 1].prevStrike : p.strike;
  };
  const openingExpiry = (p) => {
    const chain = p.rollChain || [];
    return chain.length > 0 ? chain[0].prevExpiry : p.expiry;
  };
  const expiryAfterRoll = (p, idx) => {
    const chain = p.rollChain || [];
    return idx + 1 < chain.length ? chain[idx + 1].prevExpiry : p.expiry;
  };
  const qtyLabelOf = (p) => {
    if (!isOptionNat(p)) return n(p.qty) ? String(n(p.qty)) : "";
    const c = n(p.qty) / 100;
    return Number.isInteger(c) ? String(c) : String(n(p.qty));
  };
  const dirSign = (p) => (natOf(p) === "CRED" ? -1 : 1); // corta: cerrar/recomprar es pagar

  const primaEvents = [];
  const mtmEvents = [];

  positions.forEach((p) => {
    const qty = n(p.qty);
    if (isOptionNat(p)) {
      const autoStrat = bepAutoStrat(p);
      const chain = p.rollChain || [];
      if (autoStrat === "CREDIT" && p.entryDate) {
        /* solo las opciones de CRÉDITO registran prima en la apertura. El débito (Long Call, y la pata larga
           del PMCC) no se registra hasta que se cierra, igual que las acciones. */
        const fee = n(p.comision);
        const cash = openingPrimaPerShare(p) * qty - fee;
        primaEvents.push({ id: p.id + "-open", posId: p.id, date: p.entryDate, tkr: p.tkr, block: p.block, tipo: p.tipo, kind: "Apertura", cash, fee, strike: openingStrike(p), right: p.right, qty: qtyLabelOf(p), expiry: openingExpiry(p), bep: n(openingStrike(p)) - n(openingPrimaPerShare(p)) });
      }
      chain.forEach((r, idx) => {
        const fee = n(r.comision);
        const cashRoll = (n(r.newCredit) - n(r.buybackCost)) * qty - fee;
        primaEvents.push({ id: p.id + "-roll" + idx, posId: p.id, date: r.date, tkr: p.tkr, block: p.block, tipo: p.tipo, kind: "Roll", cash: cashRoll, fee, strike: strikeAfterRoll(p, idx), right: p.right, prevStrike: r.prevStrike, qty: qtyLabelOf(p), expiry: expiryAfterRoll(p, idx), note: r.note || "" });
        const legBefore = idx === 0 ? openingPrimaPerShare(p) : n(chain[idx - 1].newCredit);
        const realized = dirSign(p) * (n(r.buybackCost) - legBefore) * qty - fee;
        mtmEvents.push({ id: p.id + "-rollmtm" + idx, posId: p.id, date: r.date, tkr: p.tkr, block: p.block, tipo: p.tipo, kind: "Roll", cash: realized, fee, strike: r.prevStrike, right: p.right, qty: qtyLabelOf(p), expiry: r.prevExpiry, note: r.note || "" });
      });
      if (p.closed && p.closePrice !== "" && p.closePrice != null) {
        const fee = n(p.closeComision);
        const cashClose = dirSign(p) * n(p.closePrice) * qty - fee;
        primaEvents.push({ id: p.id + "-close", posId: p.id, date: p.closeDate, tkr: p.tkr, block: p.block, tipo: p.tipo, kind: n(p.closePrice) === 0 ? "Expirada" : "Cierre", cash: cashClose, fee, strike: p.strike, right: p.right, qty: qtyLabelOf(p), expiry: p.expiry, bep: n(effBep(p)), note: p.closeNote || "" });
        const legEntry = chain.length > 0 ? n(chain[chain.length - 1].newCredit) : openingPrimaPerShare(p);
        const realizedClose = dirSign(p) * (n(p.closePrice) - legEntry) * qty - fee;
        mtmEvents.push({ id: p.id + "-closemtm", posId: p.id, date: p.closeDate, tkr: p.tkr, block: p.block, tipo: p.tipo, kind: n(p.closePrice) === 0 ? "Expirada" : "Cierre", cash: realizedClose, fee, strike: p.strike, right: p.right, qty: qtyLabelOf(p), expiry: p.expiry, bep: n(effBep(p)), note: p.closeNote || "" });
      }
      /* PMCC: la pata LARGA (call comprada, débito) no se registró al abrir. Al cerrar el PMCC, si se indica
         el precio de venta de la long, se registra su cash (venta) en Primas y su resultado realizado en MTM. */
      if (isPMCC(p) && p.closed && p.closeLongPrice !== "" && p.closeLongPrice != null) {
        const lg = p.long || {};
        const lgFee = n(p.closeLongComision);
        const cashLong = n(p.closeLongPrice) * qty - lgFee;
        primaEvents.push({ id: p.id + "-longclose", posId: p.id, date: p.closeDate, tkr: p.tkr, block: p.block, tipo: p.tipo, kind: "Cierre long", cash: cashLong, fee: lgFee, strike: lg.strike, right: "C", qty: qtyLabelOf(p), expiry: lg.expiry, bep: n(lg.prima), note: "Pata larga · " + (p.closeNote || "") });
        const realizedLong = (n(p.closeLongPrice) - n(lg.prima)) * qty - lgFee;
        mtmEvents.push({ id: p.id + "-longclosemtm", posId: p.id, date: p.closeDate, tkr: p.tkr, block: p.block, tipo: p.tipo, kind: "Cierre long", cash: realizedLong, fee: lgFee, strike: lg.strike, right: "C", qty: qtyLabelOf(p), expiry: lg.expiry, bep: n(lg.prima), note: "Pata larga · " + (p.closeNote || "") });
      }
    } else if ((natOf(p) === "ACC" || natOf(p) === "COLLAR") && p.closed && p.closePrice !== "" && p.closePrice != null) {
      const fee = n(p.closeComision);
      const net = (n(p.closePrice) - n(effBep(p))) * qty - fee;
      mtmEvents.push({ id: p.id + "-closemtm", posId: p.id, date: p.closeDate, tkr: p.tkr, block: p.block, tipo: p.tipo, kind: "Cierre", cash: net, fee, strike: "", right: "", qty: qtyLabelOf(p), bep: n(effBep(p)), note: p.closeNote || "" });
    }
  });

  const events = sub === "primas" ? primaEvents : mtmEvents;
  events.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));

  const monthGroups = {};
  const yearTotals = {};
  events.forEach((e) => {
    const mKey = e.date ? e.date.slice(0, 7) : "sin-fecha";
    const yKey = e.date ? e.date.slice(0, 4) : "sin-fecha";
    if (!monthGroups[mKey]) monthGroups[mKey] = { items: [], total: 0, fees: 0 };
    monthGroups[mKey].items.push(e);
    monthGroups[mKey].total += e.cash;
    monthGroups[mKey].fees += e.fee || 0;
    if (!yearTotals[yKey]) yearTotals[yKey] = { total: 0, fees: 0 };
    yearTotals[yKey].total += e.cash;
    yearTotals[yKey].fees += e.fee || 0;
  });
  const monthKeys = Object.keys(monthGroups).sort();
  const yearKeys = Object.keys(yearTotals).sort();
  const monthsOfYear = (y) => monthKeys.filter((k) => (k === "sin-fecha" ? y === "sin-fecha" : k.slice(0, 4) === y));
  const grandTotal = events.reduce((s, e) => s + e.cash, 0);
  const grandFees = events.reduce((s, e) => s + (e.fee || 0), 0);
  const MESES = ["ENE", "FEB", "MAR", "ABR", "MAY", "JUN", "JUL", "AGO", "SEP", "OCT", "NOV", "DIC"];
  const monthLabel = (key) => { if (key === "sin-fecha") return "Sin fecha"; const [y, m] = key.split("-"); return MESES[Number(m) - 1] + " " + y; };

  /* ---------- Estrategias: todas las posiciones archivadas por tipo ---------- */
  const STRAT_CATS = ["Acciones", "Covered Calls", "Short Puts", "Long Calls", "PMCC", "DC/DD", "Otras"];
  const categoryOf = (p) => {
    const t = (p.tipo || "").toLowerCase();
    if (isCashNat(p)) return null; // cash no es una estrategia
    if (natOf(p) === "ACC") return "Acciones";
    if (t === "pmcc") return "PMCC";
    if (isLongCallPos(p)) return "Long Calls";
    if (["dc", "dd", "diagonal", "calendar"].includes(t)) return "DC/DD";
    if (t === "short put") return "Short Puts";
    if (t === "short call") return "Covered Calls";
    /* cualquier opción corta (nat Crédito) de CUALQUIER bloque cae en su estrategia por el right,
       aunque la etiqueta de estrategia esté vacía o sea otra: P → Short Puts, C → Covered Calls */
    if (natOf(p) === "CRED") return p.right === "C" ? "Covered Calls" : "Short Puts";
    return "Otras";
  };
  const catCount = (c, closed) => positions.filter((p) => categoryOf(p) === c && !!p.closed === closed).length;
  const stratItems = positions
    .filter((p) => categoryOf(p) === stratCat && !!p.closed === (stratStatus === "Cerradas"))
    .sort((a, b) => ((b.closeDate || b.entryDate || "") < (a.closeDate || a.entryDate || "") ? -1 : 1));

  const primaSumOf = (p) => primaEvents.filter((e) => e.posId === p.id).reduce((s, e) => s + e.cash, 0);
  const mtmSumOf = (p) => mtmEvents.filter((e) => e.posId === p.id).reduce((s, e) => s + e.cash, 0);
  const todayIso = new Date().toISOString().slice(0, 10);
  const shortDate = (iso) => { if (!iso) return ""; const [y, m, d] = iso.split("-"); return `${d}/${m}/${y.slice(-2)}`; };

  return (
    <>
      <div style={{ display: "flex", gap: 6, background: T.card, borderRadius: 18, padding: 6, marginBottom: 14, boxShadow: T.shadow }}>
        {[["primas", "Primas"], ["mtm", "MTM"], ["estrategias", "Estrategias"]].map(([id, label]) => (
          <button key={id} onClick={() => setSub(id)} style={{
            flex: 1, border: "none", cursor: "pointer", borderRadius: 13, padding: "8px 0 7px", fontSize: 12, fontWeight: 700,
            display: "flex", flexDirection: "column", alignItems: "center", gap: 3,

            const annPeriod = p.closed ? dit : dte;

                  </div>
                </div>
                {open && (
                  <div onClick={(ev) => ev.stopPropagation()} style={{ marginTop: 8, background: T.tile, borderRadius: 16, padding: "12px 12px" }}>
                    {isOpt ? (
                      <>
                        {/* cabecera al estilo Comparador: prima grande a la izquierda, Annualized ROI grande a la derecha */}

                          <div style={{ display: "flex", gap: 14, background: T.card, borderRadius: 12, padding: "8px 12px", flexShrink: 0 }}>
                            <div style={{ textAlign: "center" }}>

                              <div style={{ fontSize: 13, fontWeight: 800, color: T.ink }}>${money(riesgo)}</div>
                            </div>
                            <div style={{ textAlign: "center" }}>
                              <div style={{ fontSize: 10, color: T.sub, fontWeight: 500 }}>BEP</div>
                              <div style={{ fontSize: 13, fontWeight: 800, color: T.ink }}>${money2(effBep(p))}</div>
                            </div>
                          </div>
                        </div>
                        {/* fila alineada de 4 tiles: IVR · Strike · DTE · DIT */}
                        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 8, marginBottom: (natOf(p) === "CRED" || chain.length > 0 || p.closed) ? 10 : 0 }}>
                          {[["IVR", p.ivr || "—"], ["Strike", n(p.strike) ? "$" + strikeStr(p.strike) : "—"], ["DTE", isFinite(dte) ? dte + "d" : "—"], ["DIT", isFinite(dit) ? dit + "d" : "—"]].map(([lbl, val]) => (
                            <div key={lbl} style={{ background: T.card, borderRadius: 14, padding: "10px 4px", textAlign: "center", minWidth: 0 }}>
                              <div style={{ fontSize: 15, fontWeight: 800, color: T.ink, whiteSpace: "nowrap" }}>{val}</div>
                              <div style={{ fontSize: 10, color: T.sub, marginTop: 2, fontWeight: 500 }}>{lbl}</div>
                            </div>
                          ))}
                        </div>
                      </>
                    ) : (
                      <>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10, marginBottom: 10 }}>
                          <div>
                            <div style={{ fontSize: 22, fontWeight: 800, color: (p.closed ? result : effPnl(p)) >= 0 ? T.green : T.red, letterSpacing: -0.4 }}>{signMoney(p.closed ? result : effPnl(p))}</div>
                            <div style={{ fontSize: 10.5, color: T.sub, fontWeight: 500 }}>{p.closed ? "P&L realizado" : "P&L unrealised"}</div>
                          </div>
                          {p.closed && (
                            <div style={{ textAlign: "right" }}>
                              <div style={{ fontSize: 22, fontWeight: 800, color: isFinite(stockAnnRoi) && stockAnnRoi >= 0 ? T.green : T.red, letterSpacing: -0.4 }}>{fmtPct2(stockAnnRoi)}</div>
                              <div style={{ fontSize: 10.5, color: T.sub, fontWeight: 500 }}>Annualized ROI</div>

                          <Tile label="DIT" value={isFinite(dit) ? dit + "d" : "—"} />

                    {isOpt && (natOf(p) === "CRED" || chain.length > 0 || p.closed) && (
                      <div>
                        <div style={{ fontSize: 10, color: T.sub, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 6 }}>{chain.length > 0 ? "Cadena de rolls" : "Patas de la operación"}</div>
                        <RollChainTable p={p} />
                      </div>
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </>
