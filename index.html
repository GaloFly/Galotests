/* ---------- COMPARADOR: fila EL con base ghost + delta ---------- */
function ElRow({ label, post, base, delta, color, min, max, zones, marks }) {
  return (
    <div style={{ marginBottom: 14 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
        <span style={{ fontSize: 13, fontWeight: 700, color: T.ink }}>{label}</span>
        <span>
          <span style={{ fontSize: 17, fontWeight: 800, color }}>{pct(post)}</span>
          <span style={{ fontSize: 12, fontWeight: 700, color: delta < 0 ? T.red : T.green, marginLeft: 6 }}>{signPct(delta)}</span>
        </span>
      </div>
      <ZoneBar value={post} base={base} min={min} max={max} zones={zones} />
      <Scale min={min} max={max} marks={marks} />
      <div style={{ fontSize: 11, color: T.sub, marginTop: 2 }}>base {pct(base)} → {pct(post)}</div>
    </div>
  );
}

/* ---------- COMPARADOR: contenido de la vista (la cuenta base viene de Portfolio) ---------- */
function ComparadorContent({ nlv, margin, el, brokerLabel, trades, setTrades, basis, setBasis }) {
  const [editSet, setEditSet] = useState(() => new Set());
  const [ocrBusy, setOcrBusy] = useState(false);
  /* algunos iOS disparan el evento "change" del <input type=file> DOS veces para la misma selección
     (sobre todo saliendo de la cámara/galería) — sin esto, "una foto" podía convertirse en 2 llamadas
     a Gemini de golpe. setOcrBusy(true) es async (no se ve hasta el siguiente render), así que un ref
     síncrono es la única forma fiable de bloquear el segundo disparo en el mismo tick. */
  const ocrLockRef = useRef(false);
  const [ocrMsg, setOcrMsg] = useState("");
  const base = { elNlv: nlv ? el / nlv : NaN, elMrgn: margin ? el / margin : NaN };
  const baseEmpty = !nlv && !margin;

  const computed = useMemo(() => trades.map((tr) => {
    const strike = n(tr.strike), creditPS = n(tr.credit), tMargin = n(tr.margin);
    const notional = strike > 0 ? (strike - creditPS) * 100 : 0;   // (Strike − Credit) × 100
    const premium = creditPS * 100;                                // Credit × 100
    const bep = strike > 0 ? strike - creditPS : NaN;               // break-even = Strike − Credit (por acción)
    const underlyingN = n(tr.underlying);
    /* margen de seguridad del BEP: % que necesitaría CAER el subyacente para tocar el BEP (por eso negativo = a salvo,
       igual que decir "-20% hasta breakeven"). Positivo = el subyacente ya está por debajo del BEP (ya en pérdida).
       Asume el modelo suelo-por-debajo (short put), que es el que usa todo el Comparador (Strike − Credit);
       en un short call leería al revés. */
    const bepMargin = (underlyingN > 0 && isFinite(bep)) ? (bep - underlyingN) / underlyingN : NaN;
    const newEL = el - tMargin;
    const newMargin = margin + tMargin;
    const elNlv = nlv ? newEL / nlv : NaN;
    const elMrgn = newMargin ? newEL / newMargin : NaN;
    const posSize = nlv ? notional / nlv : NaN;
    const roi = notional ? premium / notional : NaN;               // ROI = Premium / Notional
    const rom = tMargin ? premium / tMargin : NaN;                  // Return on margin = Premium / Margin
    const ann = n(tr.dte) ? 365 / n(tr.dte) : 0;
    const annRoi = roi * ann;
    /* eficiencia vs Delta: cuánto Annualized ROI (%) consigues por cada punto de Delta expuesto —
       a igual ROI, menos Delta (menos "acción sintética" comprometida) es mejor; por eso se divide, no se multiplica. */
    const deltaAbs = Math.abs(n(tr.delta));
    const deltaEff = deltaAbs ? (annRoi * 100) / deltaAbs : NaN;
    let status = "GO";
    if (elNlv < RULES.elNlv.amber || elMrgn < RULES.elMrgn.amber) status = "NO-GO";
    else if (elNlv < RULES.elNlv.green || elMrgn < RULES.elMrgn.green) status = "CAUTION";
    return { ...tr, notional, premium, bep, bepMargin, elNlv, elMrgn, dElNlv: elNlv - base.elNlv, dElMrgn: elMrgn - base.elMrgn, posSize, roi, rom, annRoi, annRom: rom * ann, deltaAbs, deltaEff, status };
  }), [trades, nlv, margin, el]);

  const rankVal = (c) => (basis === "roi" ? c.roi : basis === "annRoi" ? c.annRoi : basis === "rom" ? c.rom : basis === "impact" ? c.elNlv : basis === "delta" ? c.deltaEff : c.annRom);
  const okOrder = { GO: 0, CAUTION: 1, "NO-GO": 2 };
  const ranked = useMemo(() => [...computed].sort((a, b) => {
    if (okOrder[a.status] !== okOrder[b.status]) return okOrder[a.status] - okOrder[b.status];
    return (rankVal(b) || -Infinity) - (rankVal(a) || -Infinity);
  }), [computed, basis]);

  // tarjeta "vacía" = recién añadida sin datos → debe salir arriba para no bajar
  const isEmptyCard = (c) => !((c.tkr || "").trim()) && n(c.strike) === 0 && n(c.credit) === 0 && n(c.margin) === 0;
  const display = useMemo(() => {
    const empties = computed.filter(isEmptyCard);
    const rest = ranked.filter((c) => !isEmptyCard(c));
    return [...empties, ...rest];
  }, [computed, ranked]);

  const winner = ranked[0];
  const allNoGo = computed.length > 0 && computed.every((c) => c.status === "NO-GO");
  const BASIS = {
    roi: { lead: "Mejor ROI", label: "ROI", val: (c) => pct(c.roi, 2) },
    annRoi: { lead: "Mejor Annualized ROI", label: "Annualized ROI", val: (c) => pct(c.annRoi, 1) },
    rom: { lead: "Mejor return on margin", label: "Return on margin", val: (c) => pct(c.rom, 2) },
    annRom: { lead: "Mejor annualized return on margin", label: "Annualized return on margin", val: (c) => pct(c.annRom, 0) },
    impact: { lead: "Menor impacto en margen", label: "EL/NLV que deja", val: (c) => pct(c.elNlv) },
    delta: { lead: "Mejor eficiencia vs Delta", label: "Annualized ROI / Delta", val: (c) => (isFinite(c.deltaEff) ? c.deltaEff.toFixed(2) + "%/Δ" : "—") },
  };
  let rationale = "";
  if (winner) {
    const lead = BASIS[basis].lead;
    if (allNoGo) rationale = `Ninguna respeta los suelos de margen. La menos agresiva deja EL/NLV en ${pct(winner.elNlv)}.`;
    else if (winner.status === "GO") rationale = `${lead}. Deja EL/NLV en ${pct(winner.elNlv)} y EL/MRGN en ${pct(winner.elMrgn)}, ambos sobre suelo.`;
    else rationale = `${lead}, pero deja EL/MRGN en ${pct(winner.elMrgn)} (bajo objetivo 100%). Vigila el colchón.`;
  }

  const setTr = (id, k) => (v) => setTrades((ts) => ts.map((t) => (t.id === id ? { ...t, [k]: v } : t)));
  const toggleEdit = (id) => setEditSet((s) => { const x = new Set(s); x.has(id) ? x.delete(id) : x.add(id); return x; });
  const addTrade = () => { const id = newId(); setTrades((ts) => [{ id, tkr: "", dte: "30", strike: "", credit: "", margin: "", right: "P", expiry: "", underlying: "", delta: "", pop: "" }, ...ts]); setEditSet((s) => new Set(s).add(id)); };
  const delTrade = (id) => setTrades((ts) => ts.filter((t) => t.id !== id));

  const errToStr = (err) => {
    if (!err) return "error desconocido";
    if (err.message) return err.message;
    try { return String(err); } catch (_) { return "error desconocido"; }
  };
  const summarizeTrade = (p, prefix) => {
    const parts = [];
    if (p.tkr) parts.push(p.tkr + (p.right || ""));
    if (p.strike) parts.push("strike $" + p.strike);
    if (p.dte) parts.push(p.dte + " DTE");
    if (p.ask != null && p.bid != null) parts.push(`mid $${p.credit} (ask ${p.ask} / bid ${p.bid})`);
    else if (p.credit) parts.push("prima $" + p.credit);
    if (p.margin) parts.push("margen $" + p.margin);
    if (p.underlying) parts.push("subyacente $" + p.underlying);
    if (p.delta) parts.push("delta " + p.delta);
    if (p.pop) parts.push("POP " + p.pop + "%");
    return (prefix || "") + (parts.length ? `Leído: ${parts.join(" · ")}` : "no pude leer los datos con claridad");
  };
  /* lee UNA captura y devuelve { trade, message } sin tocar el estado de UI — así el llamador
     (una sola foto o un lote de varias) decide cómo mostrar progreso/errores.
     onWaiting(ms) es opcional: se llama mientras esperamos el cooldown de un 429 para poder avisar en pantalla. */
  const sleep = (ms) => new Promise((res) => setTimeout(res, ms));
  const readOneScreenshot = async (file, gkey, onWaiting) => {
    if (!gkey) return { trade: null, message: "añade tu API key de Gemini en Ajustes para leer capturas" };
    let geminiErr = "";
    /* Ante 429 (cupo gratuito agotado): prueba el SIGUIENTE modelo de GEMINI_MODELS — tiene cupo
       independiente (Flash → Flash-Lite). Solo si TODOS están a 429 esperamos el cooldown del
       primero y reintentamos una última vuelta antes de rendirnos. */
    for (let round = 0; round < 2; round++) {
      let rateLimited = false, waitMs = 0;
      for (let mi = 0; mi < GEMINI_MODELS.length; mi++) {
        const model = GEMINI_MODELS[mi];
        try {
          const data = await extractOptionFromImage(file, gkey, model);
          const trade = buildTradeFromGemini(data, file);
          return { trade, message: summarizeTrade(trade) };
        } catch (err) {
          console.error("[Comparador] Gemini OCR falló (" + model + "):", err);
          geminiErr = errToStr(err);
          if (err && err.status === 429) {
            rateLimited = true;
            if (err.retryAfterMs) waitMs = Math.max(waitMs, err.retryAfterMs);
            continue; // prueba el siguiente modelo
          }
          // error que no es de cupo (key inválida, respuesta rara…): no tiene sentido seguir probando
          return { trade: null, message: "Gemini falló: " + geminiErr };
        }
      }
      // llegamos aquí = todos los modelos dieron 429 en esta vuelta
      if (round === 0 && rateLimited && waitMs) {
        const ms = Math.min(waitMs + 500, 65000);
        if (onWaiting) onWaiting(ms);
        await sleep(ms);
        continue; // una segunda y última vuelta tras esperar
      }
      break;
    }
    return { trade: null, message: "Gemini falló en Flash y Flash-Lite (cupo agotado en ambos): " + geminiErr };
  };
  /* acepta una o varias fotos; las procesa en orden y añade cada operación YA COLAPSADA
     (sin abrir el editable) — revisar los campos leídos es opcional, no forzoso */
  const runOcr = async (files) => {
    const list = Array.from(files || []).filter(Boolean);
    if (!list.length) return;
    if (ocrLockRef.current) { console.warn("[Comparador] runOcr ya en curso, ignoro disparo duplicado"); return; }
    ocrLockRef.current = true;
    const gkey = (() => { try { return localStorage.getItem(KEY_GEMINI) || ""; } catch (e) { return ""; } })();
    setOcrBusy(true);
    const multi = list.length > 1;
    /* Antes se leía una captura por vez (i=0..n-1 en serie): con un lote de varias fotos, el tiempo
       total era la SUMA de la latencia de cada llamada a Gemini. Cada foto es independiente, así que
       las lanzamos en paralelo con un límite de 3 a la vez (evita disparar 429 de golpe si hay muchas). */
    const CONCURRENCY = Math.min(3, list.length);
    const results = new Array(list.length);
    const trades = new Array(list.length);
    let doneCount = 0;
    setOcrMsg(multi ? `Leyendo ${list.length} capturas… (0/${list.length})` : (gkey ? "Leyendo captura con Gemini…" : "Leyendo captura…"));
    let nextIndex = 0;
    const worker = async () => {
      while (nextIndex < list.length) {
        const i = nextIndex++;
        const onWaiting = (ms) => setOcrMsg(`${multi ? `Captura ${i + 1}/${list.length}: ` : ""}límite de Gemini alcanzado, esperando ${Math.ceil(ms / 1000)}s para reintentar…`);
        const { trade, message } = await readOneScreenshot(list[i], gkey, onWaiting);
        trades[i] = trade;
        results[i] = multi ? `#${i + 1}: ${message}` : message;
        doneCount++;
        if (multi) setOcrMsg(`Leyendo ${list.length} capturas… (${doneCount}/${list.length})`);
      }
    };
    await Promise.all(Array.from({ length: CONCURRENCY }, worker));
    /* insertamos en el mismo orden final que daba la versión en serie: la última foto del lote queda
       arriba del todo (más reciente primero), igual que antes. */
    const newRows = [];
    for (let i = list.length - 1; i >= 0; i--) {
      const trade = trades[i];
      if (trade) {
        const id = newId();
        newRows.push({ id, tkr: trade.tkr || "", dte: trade.dte || "30", strike: trade.strike || "", credit: trade.credit || "", margin: trade.margin || "", right: trade.right || "P", expiry: trade.expiry || "", underlying: trade.underlying || "", delta: trade.delta || "", pop: trade.pop || "" });
      }
    }
    if (newRows.length) setTrades((ts) => [...newRows, ...ts]);
    setOcrBusy(false);
    ocrLockRef.current = false;
    setOcrMsg(results.join("  ·  ") + ". Revisa los campos antes de usarlos.");
    setTimeout(() => setOcrMsg(""), Math.min(10000 + list.length * 3000, 22000));
  };

  const seg = (key, label) => (
    <button onClick={() => setBasis(key)} style={{ border: "none", cursor: "pointer", borderRadius: 11, padding: "7px 11px", fontSize: 12, fontWeight: 700, fontFamily: T.sans, background: basis === key ? "#fff" : "rgba(255,255,255,0.07)", color: basis === key ? T.dark : "#C4CCD4" }}>{label}</button>
  );

  return (
    <>
      {baseEmpty && (
        <div style={{ background: T.card, borderRadius: 24, padding: 18, marginBottom: 16, boxShadow: T.shadow, fontSize: 13.5, color: T.sub, fontWeight: 600, lineHeight: 1.5 }}>
          El estado base (NLV, Margin, Excess Liq) sale de la tarjeta Cuenta de arriba — la misma de Portfolio. Añade posiciones y cash/margin en Portfolio y el Comparador evalúa contra esos números.
        </div>
      )}

      {/* MEJOR OPCIÓN */}
      {winner && (
        <div style={{ background: T.dark, borderRadius: 24, padding: 18, marginBottom: 16, color: "#fff", boxShadow: T.shadow }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: "#B9C2CC", letterSpacing: 0.5, textTransform: "uppercase" }}>Mejor opción</div>
              <div style={{ fontSize: 26, fontWeight: 800, marginTop: 3, letterSpacing: -0.5, color: winner.tkr ? "#fff" : "#8A94A0", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", lineHeight: 1.05 }}>{tickerOf(winner)}</div>
              {strikeLineOf(winner) && <div style={{ fontSize: 13, color: "#B9C2CC", fontWeight: 600, marginTop: 2 }}>{strikeLineOf(winner)}</div>}
              {dteDeltaOf(winner) && <div style={{ fontSize: 12, color: "#8B95A0", fontWeight: 600, marginTop: 1 }}>{dteDeltaOf(winner)}</div>}
            </div>
            <div style={{ textAlign: "right", flexShrink: 0 }}>
              <div style={{ fontSize: 26, fontWeight: 800, color: allNoGo ? T.orange : T.green, letterSpacing: -0.5 }}>{BASIS[basis].val(winner)}</div>
              <div style={{ fontSize: 12, color: "#B9C2CC", fontWeight: 500 }}>{BASIS[basis].label}</div>
            </div>
          </div>
          <div style={{ fontSize: 13.5, color: "#DDE3E9", lineHeight: 1.45, margin: "10px 0 14px" }}>{rationale}</div>
          <div style={{ fontSize: 11, color: "#8B95A0", fontWeight: 600, marginBottom: 7, letterSpacing: 0.4, textTransform: "uppercase" }}>Comparar por</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
            {seg("roi", "ROI")}{seg("annRoi", "Annualized ROI")}{seg("rom", "Return on margin")}{seg("annRom", "Annualized return on margin")}{seg("impact", "Impacto")}{seg("delta", "Eficiencia vs Delta")}
          </div>
        </div>
      )}

      {ocrMsg && (
        <div style={{ fontSize: 12, color: ocrMsg.startsWith("Error") ? T.red : T.green, fontWeight: 700, marginBottom: 12, background: ocrMsg.startsWith("Error") ? T.tileRed : T.tileGreen, borderRadius: 12, padding: "8px 12px", lineHeight: 1.4 }}>{ocrMsg}</div>
      )}

      {/* añadir / limpiar */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", margin: "4px 4px 12px", gap: 8, flexWrap: "wrap" }}>
        <span style={{ fontSize: 15, fontWeight: 700, color: T.ink }}>Candidatas · {computed.length}</span>
        <div style={{ display: "flex", gap: 8 }}>
          <input id="ocr-file-input" type="file" accept="image/*" multiple style={{ display: "none" }}
            onChange={(e) => { const fs = e.target.files ? Array.from(e.target.files) : []; e.target.value = ""; if (fs.length) runOcr(fs); }} />
          <button onClick={() => document.getElementById("ocr-file-input").click()} disabled={ocrBusy} style={{ background: T.card, border: "none", borderRadius: 14, padding: "9px 14px", fontSize: 13.5, fontWeight: 700, color: T.ink, cursor: "pointer", boxShadow: T.shadow }}>{ocrBusy ? "Leyendo…" : "📷 Leer captura(s)"}</button>
          <button onClick={addTrade} style={{ background: T.green, border: "none", borderRadius: 14, padding: "9px 16px", fontSize: 14, fontWeight: 700, color: "#fff", cursor: "pointer", boxShadow: "0 4px 12px rgba(27,163,76,0.3)" }}>+ Operación</button>
        </div>
      </div>

      {/* TARJETAS */}
      <div style={{ display: "grid", gap: 14 }}>
        {display.map((c) => {
          const isBest = !allNoGo && winner && c.id === winner.id && !isEmptyCard(c);
          const vt = c.status === "GO" ? "green" : c.status === "CAUTION" ? "amber" : "red";
          const vcol = HEX[vt];
          const vbg = vt === "green" ? T.tileGreen : vt === "amber" ? T.tileAmber : T.tileRed;
          const editing = editSet.has(c.id);
          return (
            <SwipeDelete key={c.id} onDelete={() => delTrade(c.id)}>
            <div style={{ background: T.card, borderRadius: 24, padding: 16, boxShadow: T.shadow, border: isBest ? `2px solid ${T.green}` : "2px solid transparent" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10, marginBottom: 12 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 9, minWidth: 0 }}>
                  <span style={{ background: vbg, color: vcol, borderRadius: 10, padding: "5px 9px", fontSize: 12, fontWeight: 800, letterSpacing: 0.5, whiteSpace: "nowrap" }}>{c.status}</span>
                  <div style={{ minWidth: 0 }}>
                    <div style={{ fontSize: 19, fontWeight: 800, letterSpacing: -0.4, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", color: c.tkr ? T.ink : T.sub, lineHeight: 1.1 }}>{tickerOf(c)}</div>
                    {strikeLineOf(c) && <div style={{ fontSize: 12, color: T.sub, fontWeight: 600, marginTop: 1 }}>{strikeLineOf(c)}</div>}
                    {dteDeltaOf(c) && <div style={{ fontSize: 11, color: T.sub, fontWeight: 600, marginTop: 1 }}>{dteDeltaOf(c)}</div>}
                  </div>
                </div>
                <div style={{ textAlign: "right", flexShrink: 0 }}>
                  <div style={{ fontSize: 22, fontWeight: 800, color: T.green, letterSpacing: -0.5 }}>{signPct(c.annRoi, 2)}</div>
                  <div style={{ fontSize: 12, color: T.sub, fontWeight: 500 }}>Annualized ROI</div>
                </div>
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, marginBottom: 14, flexWrap: "wrap" }}>
                <div style={{ display: "flex", gap: 20 }}>
                  <MiniStat label="Premium" value={"$" + money2(c.premium)} size={18} />
                  <MiniStat label="ROI" value={signPct(c.roi, 2)} color={T.green} size={18} />
                </div>
                <div style={{ display: "flex", gap: 14, background: T.tile, borderRadius: 12, padding: "8px 12px", flexShrink: 0 }}>
                  <div style={{ textAlign: "center" }}>
                    <div style={{ fontSize: 10, color: T.sub, fontWeight: 500 }}>Riesgo</div>
                    <div style={{ fontSize: 13, fontWeight: 800, color: T.ink }}>${money(c.notional)}</div>
                  </div>
                  <div style={{ textAlign: "center" }}>
                    <div style={{ fontSize: 10, color: T.sub, fontWeight: 500 }}>BEP</div>
                    <div style={{ fontSize: 13, fontWeight: 800, color: T.ink }}>{isFinite(c.bep) ? "$" + money2(c.bep) : "—"}</div>
                    {isFinite(c.bepMargin) && <div style={{ fontSize: 11, fontWeight: 700, color: c.bepMargin <= 0 ? T.green : T.red }}>({pct(c.bepMargin, 0)})</div>}
                  </div>
                </div>
              </div>

              {editing && (
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 9, marginBottom: 14, paddingBottom: 14, borderBottom: `1px solid ${T.line}` }}>
                  <EditField label="Ticker / nombre" value={c.tkr} onChange={setTr(c.id, "tkr")} span={2} text />
                  <EditField label="DTE" value={c.dte} onChange={setTr(c.id, "dte")} />
                  <EditField label="Strike" prefix="$" value={c.strike} onChange={setTr(c.id, "strike")} />
                  <label>
                    <span style={{ display: "block", fontSize: 10, color: T.sub, fontWeight: 600, marginBottom: 3, textTransform: "uppercase", letterSpacing: 0.4 }}>Expiry</span>
                    <input type="date" value={c.expiry || ""} onChange={(e) => {
                      const val = e.target.value;
                      if (!val) { setTr(c.id, "expiry")(""); return; }
                      const exp = new Date(val + "T00:00:00Z");
                      const today = new Date(); const todayUTC = Date.UTC(today.getFullYear(), today.getMonth(), today.getDate());
                      const newDte = isNaN(exp.getTime()) ? null : Math.max(Math.round((exp.getTime() - todayUTC) / 86400000), 0);
                      setTrades((ts) => ts.map((t) => (t.id === c.id ? { ...t, expiry: val, dte: newDte != null ? String(newDte) : t.dte } : t)));
                    }} style={{ width: "100%", boxSizing: "border-box", height: 36, background: T.tile, border: `1.5px solid ${T.line}`, borderRadius: 11, color: c.expiry ? T.ink : T.sub, fontSize: 13, fontWeight: 700, padding: "0 8px", outline: "none", appearance: "none", WebkitAppearance: "none" }} />
                  </label>
                  <EditField label="Credit" prefix="$" value={c.credit} onChange={setTr(c.id, "credit")} />
                  <EditField label="Margin" prefix="$" value={c.margin} onChange={setTr(c.id, "margin")} />
                  <EditField label="Precio subyacente" prefix="$" value={c.underlying} onChange={setTr(c.id, "underlying")} span={2} />
                  <EditField label="Delta" value={c.delta} onChange={setTr(c.id, "delta")} span={2} />
                  <EditField label="POP (%)" value={c.pop} onChange={setTr(c.id, "pop")} span={2} />
                </div>
              )}

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 9, marginBottom: 14 }}>
                <Tile label="Position Size" value={pct(c.posSize)} />
                <Tile label="Return on margin" value={pct(c.rom, 1)} />
                <Tile label="Annualized return on margin" value={pct(c.annRom, 0)} tone="green" />
              </div>

              <ElRow label="EL / NLV post" post={c.elNlv} base={base.elNlv} delta={c.dElNlv} color={HEX[toneNlv(c.elNlv)]} min={0} max={0.6} zones={Z_NLV()} marks={M_NLV_FULL} />
              <ElRow label="EL / MRGN post" post={c.elMrgn} base={base.elMrgn} delta={c.dElMrgn} color={HEX[toneMrgn(c.elMrgn)]} min={0} max={1.5} zones={Z_MRGN()} marks={M_MRGN_FULL} />

              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 4, paddingTop: 13, borderTop: `1px solid ${T.line}` }}>
                <button onClick={() => toggleEdit(c.id)} style={{ background: editing ? T.dark : T.tile, border: "none", borderRadius: 12, padding: "8px 16px", fontSize: 13.5, fontWeight: 700, color: editing ? "#fff" : T.ink, cursor: "pointer" }}>{editing ? "✓ Hecho" : "✎ Editar"}</button>
                <button onClick={() => delTrade(c.id)} style={{ background: "transparent", border: "none", borderRadius: 12, padding: "8px 14px", fontSize: 13.5, fontWeight: 700, color: T.red, cursor: "pointer" }}>Eliminar</button>
              </div>
            </div>
            </SwipeDelete>
          );
        })}
        {computed.length === 0 && !baseEmpty && (
          <div style={{ background: T.card, borderRadius: 24, padding: 30, textAlign: "center", boxShadow: T.shadow }}>
            <div style={{ fontSize: 15, fontWeight: 600, color: T.sub }}>Añade una operación con "+ Operación" para compararla contra tu cuenta ({brokerLabel}).</div>
          </div>
        )}
      </div>
    </>
  );
}

/* ============================================================ */
function App() {
  /* modo oscuro: por defecto CLARO siempre, sin importar el ajuste del sistema — el icono ☀️/🌙 de arriba
     lo cambia a mano y se recuerda para la próxima vez (localStorage). No sigue al iPhone.
     applyTheme() se llama de forma síncrona en cada render — así T/BLOCKS/HEX/TABS/PALETTE
     están siempre al día para ese render, sea cual sea el motivo del cambio. */
  const [darkOverride, setDarkOverride] = useState(() => {
    try { return localStorage.getItem(KEY_DARK_OVERRIDE) === "dark"; } catch (e) { return false; }
  });
  const isDark = darkOverride;
  applyTheme(isDark);
  useEffect(() => {
    try {
      const tc = document.getElementById("theme-color-meta"); if (tc) tc.setAttribute("content", isDark ? "#0A0A0A" : "#EEE9E0");
      const cs = document.getElementById("color-scheme-meta"); if (cs) cs.setAttribute("content", isDark ? "dark" : "light");
    } catch (e) {}
  }, [isDark]);
  const toggleDark = () => {
    const next = !isDark;
    setDarkOverride(next);
    try { localStorage.setItem(KEY_DARK_OVERRIDE, next ? "dark" : "light"); } catch (e) {}
  };
  const [accounts, setAccounts] = useState(SEED_ACC);
  const [positions, setPositions] = useState(SEED_POS);
  const [broker, setBroker] = useState("Todos");
  const [activeTab, setActiveTab] = useState(0);
  const [chartScope, setChartScope] = useState("Bloque");
  const [selectedSlice, setSelectedSlice] = useState(null);
  const [editSet, setEditSet] = useState(() => new Set());
  const [confirmClear, setConfirmClear] = useState(false);
  const [info, setInfo] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [refreshing, setRefreshing] = useState(false);
  const [refreshMsg, setRefreshMsg] = useState("");
  const [pullDist, setPullDist] = useState(0);
  const pullTrackingRef = useRef(false);
  const pullStartYRef = useRef(0);

       SIEMPRE el 100% de la prima pagada — sin factor de plausible ni coste manual. */
    const isLongCall = nat === "DEF" && wizStrat === "Long Call";
    /* PMCC: la pata CORTA es la posición principal (nat=CRED, right=C) y se rola/registra como short call.
       La pata LARGA se guarda en p.long. BEP = prima long − prima short; riesgo = ese débito neto × qty. */
    const isPMCCw = wizStrat === "PMCC";
    const effNat = isPMCCw ? "CRED" : nat;
    const right = effNat === "CRED" ? ((wizStrat || "").toLowerCase().includes("call") || isPMCCw ? "C" : "P") : (isLongCall ? "C" : (f.right || "P"));
    const cts = parseFloat(String(f.contratos || "").replace(",", "."));
    const qty = (effNat === "CRED" || nat === "DEF") && isFinite(cts) ? String(Math.round(cts * 100)) : (f.qty || "");
    const plaus = parseFloat(String(f.plausible || "").replace(",", "."));
    const factor = (isLongCall || isPMCCw) ? "1" : (isFinite(plaus) ? String(plaus / 100) : "1");
    /* prima pagada por acción (positiva) → coste total = prima × contratos × 100, que es a la vez el riesgo
       total y el plausible del Long Call (máx pérdida = prima pagada). */
    const lcPrimaPS = Math.abs(parseFloat(String(f.prima || "").replace(",", ".")));
    const lcCost = isLongCall && isFinite(lcPrimaPS) && isFinite(cts) ? String(lcPrimaPS * cts * 100) : "";
    /* PMCC: prima long pagada y prima short cobrada (ambas positivas). Débito neto = long − short. */
    const pmLongPS = Math.abs(parseFloat(String(f.lgPrima || "").replace(",", ".")));
    const pmShortPS = Math.abs(parseFloat(String(f.prima || "").replace(",", ".")));
    const pmNetDebit = (isFinite(pmLongPS) ? pmLongPS : 0) - (isFinite(pmShortPS) ? pmShortPS : 0);
    const pmRisk = isPMCCw && isFinite(cts) ? String(Math.max(0, pmNetDebit) * cts * 100) : "";
    const p = {
      id: newId(), block: wizBlock, broker: f.broker, tkr: (f.tkr || "").toUpperCase().trim(),
      tipo: wizStrat, nat: effNat, right,
      strike: f.strike || "", expiry: f.expiry || "", qty,
      bep: (isLongCall || isPMCCw) ? "" : (f.bep || ""), prima: isLongCall ? (isFinite(lcPrimaPS) ? String(lcPrimaPS) : "") : isPMCCw ? (isFinite(pmShortPS) ? String(pmShortPS) : "") : (f.prima || ""), comision: f.comision || "", ivr: f.ivr || "",
      last: "", mktValue: "", riesgo: isLongCall ? lcCost : isPMCCw ? pmRisk : (nat === "DEF" ? (f.margen || "") : ""),
      factor, margen: isLongCall ? lcCost : isPMCCw ? pmRisk : (f.margen || ""),
      margenPct: effNat === "ACC" || effNat === "CASH" ? (f.margenPct || "") : "100",
      margenModo: effNat === "ACC" || effNat === "CASH" ? "PCT" : "VALOR",
      mktModo: "AUTO", pnlModo: isPMCCw ? "MANUAL" : (nat === "ACC" || nat === "CRED" ? "AUTO" : "MANUAL"), pnl: "0",
      entryDate: f.entryDate || "", rollChain: [],
      covered: effNat === "CRED" && right === "C" && !isPMCCw,
      coveredBy: ((effNat === "CRED" && right === "C" && !isPMCCw) || nat === "COLLAR") ? (f.coveredStockId || "") : "",
      long: isPMCCw ? { strike: f.lgStrike || "", expiry: f.lgExpiry || "", prima: isFinite(pmLongPS) ? String(pmLongPS) : "", comision: f.lgComision || "" } : undefined,
      closed: false, closeDate: "", closePrice: "", closeComision: "", closeNote: "", closeLongPrice: "", closeLongComision: "",
    };
    setPositions((ps) => {
      /* collar vinculado: fija plausBep en la acción de B1 — "0" si el collar no deja riesgo (plausible 0),
         o el BEP protegido introducido, que sustituye al BEP como base del plausible de la acción */
      if (nat === "COLLAR" && p.coveredBy) {
        const pb = f.collarRisk === "SI" ? (f.collarBep || "") : "0";
        return [...ps.map((x) => (x.id === p.coveredBy ? { ...x, plausBep: pb } : x)), p];
      }
      /* wheel: al abrir una covered call, la prima cobrada rebaja el BEP de las acciones subyacentes
         (mismo broker + ticker, abiertas), igual que ya hace rollPos con el neto de cada roll */
      if (p.covered && n(p.prima) && n(p.qty)) {
        const tkrKey = p.tkr;
        const stockMatches = p.coveredBy
          ? ps.filter((x) => x.id === p.coveredBy && !x.closed)
          : ps.filter((x) => natOf(x) === "ACC" && !x.closed && x.broker === p.broker && (x.tkr || "").trim().toUpperCase() === tkrKey);
        const stockQtyTotal = stockMatches.reduce((s, x) => s + n(x.qty), 0);
        if (stockQtyTotal) {
          const perShareAdj = (n(p.prima) * n(p.qty)) / stockQtyTotal;
          const ids = new Set(stockMatches.map((x) => x.id));
          return [...ps.map((x) => (ids.has(x.id) ? { ...x, bep: String(n(x.bep) - perShareAdj) } : x)), p];
        }
      }
      return [...ps, p];
    });
    setWizOpen(false);
    setBroker(f.broker);
    if (view !== "bloques") selectView("bloques");
  };
  const delPos = (id) => setPositions((ps) => ps.filter((p) => p.id !== id));
  /* roll de opción corta: se hace directamente desde la posición del bloque. Se piden los dos números reales
     del roll — coste de recompra del contrato viejo y crédito del contrato nuevo — más su comisión. El neto
     (crédito nuevo − recompra − comisión) se acumula sobre la prima total (BEP sigue funcionando igual) y
     además queda archivado en rollChain con su fecha: en Movimientos → Primas aparecen las dos patas (recompra
     y nueva entrada) como cash de prima, y en Movimientos → MTM aparece el neto de ESE roll como resultado
     realizado (negativo si se pagó más al recomprar de lo que se cobró en la nueva entrada).
     Covered calls (nat=Crédito, right=C): además de rolar la propia opción, el neto en $ del roll (por acción
     × cantidad de contratos) se reparte como rebaja de BEP sobre la(s) posición(es) de Acción (nat=ACC, mismo
     broker + ticker) — igual que en la contabilidad real, la prima de la covered call reduce el coste base de
     las acciones subyacentes. Si el neto es negativo (se pagó más al recomprar que lo cobrado en la nueva venta)
     el BEP de la acción sube en vez de bajar. */
  const rollPos = (id, { date, strike, expiry, buybackCost, newCredit, comision, ivr, note }) => {
    setPositions((ps) => {
      const target = ps.find((p) => p.id === id);
      const netPerShare = n(newCredit) - n(buybackCost);
      const isCoveredCall = !!target && natOf(target) === "CRED" && target.right === "C" && !isPMCC(target);
      const totalCash = isCoveredCall ? netPerShare * n(target.qty) : 0;
      const tkrKey = target ? (target.tkr || "").trim().toUpperCase() : "";
      const stockMatches = isCoveredCall && totalCash
        ? (target.coveredBy
            ? ps.filter((p) => p.id === target.coveredBy && !p.closed)
            : ps.filter((p) => p.id !== id && natOf(p) === "ACC" && !p.closed && p.broker === target.broker && (p.tkr || "").trim().toUpperCase() === tkrKey))
        : [];
      const stockQtyTotal = stockMatches.reduce((s, p) => s + n(p.qty), 0);
      const perShareAdj = stockQtyTotal ? totalCash / stockQtyTotal : 0;
      const stockIds = new Set(stockMatches.map((p) => p.id));
      return ps.map((p) => {
        if (p.id === id) {
          const prevLeg = { date: date || new Date().toISOString().slice(0, 10), prevStrike: p.strike, prevExpiry: p.expiry, prevPrima: p.prima, buybackCost: n(buybackCost), newCredit: n(newCredit), comision: n(comision), ivr: ivr || "", note: note || "" };
          return { ...p, rollChain: [...(p.rollChain || []), prevLeg], strike, expiry, prima: String(n(p.prima) + netPerShare) };
        }
        if (perShareAdj && stockIds.has(p.id)) {
          return { ...p, bep: String(n(p.bep) - perShareAdj) };
        }
        return p;
      });
    });
  };
  /* cierre de posición: acciones (o ETF/collar) solo necesitan precio de venta → resultado realizado va a MTM;
     opciones necesitan precio de recompra → cash de prima va a Primas. En ambos casos la posición se marca
     "closed" pero NO se borra (así conserva su historial para Movimientos) y deja de contar en riesgo/exposición. */
  const closePos = (id, { date, price, comision, note, longPrice, longComision }) => {
    setPositions((ps) => ps.map((p) => (p.id === id ? { ...p, closed: true, closeDate: date, closePrice: price, closeComision: comision, closeNote: note || "", closeLongPrice: longPrice != null ? longPrice : "", closeLongComision: longComision != null ? longComision : "" } : p)));
  };
  const reopenPos = (id) => setPositions((ps) => ps.map((p) => (p.id === id ? { ...p, closed: false } : p)));
  const clearAll = () => {
    if (!confirmClear) { setConfirmClear(true); setTimeout(() => setConfirmClear(false), 3000); return; }
    setPositions([]); setEditSet(new Set()); setConfirmClear(false);
    setAccounts((a) => { const next = {}; Object.keys(a).forEach((b) => { next[b] = emptyAcc(); }); return next; });
  };


  const selectTab = (id) => {
    if (id === activeTab) { setEditSet(new Set()); return; } // re-tap del bloque activo → cierra todas las ediciones abiertas
    setActiveTab(id); setSelectedSlice(null);
    if (id === "exposicion" && chartScope === "Bloque") setChartScope("NLV");
  };
  const setScopeAndReset = (s) => { setChartScope(s); setSelectedSlice(null); };

  const isBlockTab = typeof activeTab === "number";
  const blk = isBlockTab ? BLOCKS.find((b) => b.id === activeTab) : null;
  const blockPositions = isBlockTab ? active.filter((p) => p.block === activeTab) : [];

  const blockTotals = useMemo(() => {
    const t = {};
    BLOCKS.forEach((b) => { t[b.id] = active.filter((p) => p.block === b.id).reduce((s, p) => s + capDesplegado(p), 0); });
    return t;
  }, [active]);

  /* agrega posiciones del mismo ticker (una posición en acción + opción cuenta como UNA sola porción) */
  const aggregateByTicker = (pool, getValue) => {
    const map = {};
    pool.forEach((p) => {
      const v = getValue(p);
      if (v <= 0 || !p.tkr) return;
      if (!map[p.tkr]) map[p.tkr] = 0;
      map[p.tkr] += v;
    });
    return Object.entries(map).map(([tkr, value]) => ({ id: tkr, label: tkr, value })).sort((a, b) => b.value - a.value);
  };

  const chartData = useMemo(() => {
    const pool = isBlockTab ? blockPositions.filter((p) => !p.closed) : active;
    let denom = nlv, denomLabel = "NLV", getValue = (p) => capDesplegado(p);
    if (chartScope === "Bloque") { denom = blockTotals[activeTab] || 0; denomLabel = "del " + (blk ? blk.name : ""); }
    else if (chartScope === "MKT VL") { denom = mktvl; denomLabel = "MKT VL"; }
    else if (chartScope === "NLV") { denom = nlv; denomLabel = "NLV"; }
    else { denom = margin; denomLabel = "del margen usado"; getValue = effMargen; }
    const agg = aggregateByTicker(pool, getValue);
    const poolTotal = agg.reduce((s, x) => s + x.value, 0);
    const slices = agg.map((x, i) => ({ ...x, color: PALETTE[i % PALETTE.length], pctAbs: denom ? x.value / denom : NaN }));
    return { slices, total: poolTotal, denomPct: denom ? poolTotal / denom : NaN, denomLabel };
  }, [chartScope, activeTab, active, nlv, mktvl, margin, blockPositions, blockTotals, isBlockTab, blk, isDark]);

  const scopeOptions = isBlockTab ? ["Bloque", "MKT VL", "NLV", "Margen"] : ["MKT VL", "NLV", "Margen"];

  const exposureRows = useMemo(() => {
    const map = {};
    active.forEach((p) => {
      if (!p.tkr) return;
      if (!map[p.tkr]) map[p.tkr] = { tkr: p.tkr, riesgo: 0, plausible: 0, margen: 0, pnl: 0, pnlBasis: 0, last: 0, byBlock: {}, items: [] };
      map[p.tkr].riesgo += capDesplegado(p);
      map[p.tkr].plausible += plausibleOf(p);
      map[p.tkr].margen += effMargen(p);
      map[p.tkr].pnl += effPnl(p);
      map[p.tkr].pnlBasis += Math.abs(effBep(p) * n(p.qty)) || Math.abs(n(p.mktValue)) || capDesplegado(p);
      if (n(p.last) > 0 && (natOf(p) === "ACC" || !map[p.tkr].last)) map[p.tkr].last = n(p.last);
      map[p.tkr].byBlock[p.block] = (map[p.tkr].byBlock[p.block] || 0) + capDesplegado(p);
      if (natOf(p) !== "CASH") map[p.tkr].items.push(p);
    });
    return Object.values(map).filter((r) => r.riesgo > 0).sort((a, b) => b.riesgo - a.riesgo).map((r) => {
      /* filas de detalle: agrupa por bloque + (acciones: solo bloque) / (opción: bloque+right+strike+expiry) —
         así "2 put" con el mismo strike/vencimiento en el mismo bloque se funden en una fila con BEP ponderado */
      const groups = {};
      r.items.forEach((p) => {
        const isOpt = isOptionNat(p);
        const key = p.block + "|" + (isOpt ? (p.right || "") + "|" + (p.strike || "") + "|" + (p.expiry || "") : "ACC");
        if (!groups[key]) groups[key] = { block: p.block, isOpt, right: p.right, strike: p.strike, expiry: p.expiry, qty: 0, bepW: 0, riesgo: 0 };
        groups[key].qty += n(p.qty);
        groups[key].bepW += effBep(p) * n(p.qty);
        groups[key].riesgo += capDesplegado(p);
      });
      const detailRows = Object.values(groups).map((g) => {
        const contratos = g.qty / 100;
        return {
          block: g.block,
          isOpt: g.isOpt,
          qtyNum: g.isOpt ? (Number.isInteger(contratos) ? contratos : g.qty) : g.qty,
          qtyUnit: g.isOpt ? (Number.isInteger(contratos) ? "contr." : "opc") : "acc",
          desc: g.isOpt ? optionDetail({ strike: g.strike, expiry: g.expiry, right: g.right }) : "",
          bep: g.qty ? g.bepW / g.qty : NaN,
          riesgo: g.riesgo,
        };
      }).sort((a, b) => a.block - b.block || (a.isOpt === b.isOpt ? 0 : a.isOpt ? 1 : -1));
      return {
        ...r,
        pctMktvl: mktvl ? r.riesgo / mktvl : NaN,
        pctNlv: nlv ? r.riesgo / nlv : NaN,
        pctMargen: margin ? r.margen / margin : NaN,
        pnlPct: r.pnlBasis ? r.pnl / r.pnlBasis : NaN,
        blockChips: Object.entries(r.byBlock).map(([bid, val]) => {
          const b = BLOCKS.find((x) => x.id === Number(bid));
          return { id: bid, name: b.name.replace("Bloque ", "B"), color: b.color, bg: b.bg, value: r.riesgo ? val / r.riesgo : NaN };
        }),
        detailRows,
      };
    });
  }, [active, mktvl, nlv, margin, isDark]);

  /* mapa id-de-acción → lista de covered call(s) abiertas que la cubren (ordenadas por vencimiento):
     alimenta el banner "COVERED" en la fila de la acción en B1, una línea por call. Usa el enlace
     explícito coveredBy si existe; si no, el heurístico broker+ticker (covered calls antiguas sin enlace). */
  const coveredMap = useMemo(() => {
    const m = {};
    positions.forEach((cc) => {
      if (cc.closed) return;
      const isCC = natOf(cc) === "CRED" && cc.right === "C" && cc.covered;
      const isCollar = natOf(cc) === "COLLAR" && cc.coveredBy; /* collar solo si está vinculado explícitamente */
      if (!isCC && !isCollar) return;
      const cts = n(cc.qty) / 100;
      const ctsStr = cts ? (Number.isInteger(cts) ? cts : cts.toFixed(1)) + (cts === 1 ? " contrato" : " contratos") : "";
      const det = isCC ? strikeStr(cc.strike) + "C" : (n(cc.strike) ? strikeStr(cc.strike) + (cc.right || "") : "");
      const label = [det, cc.expiry ? ibkrDate(cc.expiry) : "", ctsStr].filter(Boolean).join(" · ") || (isCollar ? "activo" : "");
      const k = (cc.tkr || "").trim().toUpperCase();
      const ids = cc.coveredBy
        ? [cc.coveredBy]
        : positions.filter((s) => natOf(s) === "ACC" && !s.closed && s.broker === cc.broker && (s.tkr || "").trim().toUpperCase() === k).map((s) => s.id);
      ids.forEach((id) => { (m[id] = m[id] || []).push({ label, kind: isCollar ? "collar" : "cc", expiry: cc.expiry || "9999-12-31" }); });
    });
    Object.keys(m).forEach((id) => { m[id] = m[id].sort((a, b) => (a.expiry < b.expiry ? -1 : 1)).map((x) => ({ label: x.label, kind: x.kind })); });
    return m;
  }, [positions]);

  const vencimientosRows = useMemo(() => {
    const map = {};
    active.forEach((p) => {
      if (!isOptionNat(p) || !p.expiry) return;
      if (!map[p.expiry]) map[p.expiry] = { expiry: p.expiry, riesgo: 0, items: [] };
      map[p.expiry].riesgo += capDesplegado(p);
      map[p.expiry].items.push(p);
    });
    const today = new Date(); today.setHours(0, 0, 0, 0);
    return Object.values(map).sort((a, b) => (a.expiry < b.expiry ? -1 : 1)).map((r) => {
      /* dentro de cada fecha, agrupa por subyacente + bloque + strike/right — así "2 put" iguales
         en el mismo bloque se funden en una fila con BEP ponderado, igual que en Exposición */
      const groups = {};
      r.items.forEach((p) => {
        const key = p.tkr + "|" + p.block + "|" + (p.right || "") + "|" + (p.strike || "");
        if (!groups[key]) groups[key] = { tkr: p.tkr, block: p.block, right: p.right, strike: p.strike, qty: 0, bepW: 0, riesgo: 0, last: "", covered: false };
        groups[key].qty += n(p.qty);
        groups[key].bepW += effBep(p) * n(p.qty);
        groups[key].riesgo += capDesplegado(p);
        if (!groups[key].last && p.last) groups[key].last = p.last;
        if (p.covered) groups[key].covered = true;
      });
      const detailRows = Object.values(groups).map((g) => {
        const contratos = g.qty / 100;
        return {
          tkr: g.tkr, block: g.block, right: g.right, strike: g.strike,
          qtyNum: Number.isInteger(contratos) ? contratos : g.qty,
          bep: g.qty ? g.bepW / g.qty : NaN,
          riesgo: g.riesgo, last: g.last, covered: g.covered,
        };
      }).sort((a, b) => b.riesgo - a.riesgo);
      const dte = Math.round((new Date(r.expiry + "T00:00:00") - today) / 86400000);
      return { ...r, detailRows, dte };
    });
  }, [active]);

  /* ---------- exportar cartera completa (ignora filtro de broker) para pegar y pedir feedback ---------- */
  const [exportOpen, setExportOpen] = useState(false);
  const [exportText, setExportText] = useState("");
  const [exportCopied, setExportCopied] = useState(false);

  const buildExportText = () => {
    const mktvlAll = positions.reduce((s, p) => s + (isCashNat(p) ? 0 : effMkt(p)), 0);
    const posCashAll = positions.reduce((s, p) => s + (isCashNat(p) ? effMkt(p) : 0), 0);
    const cashAll = brokers.reduce((s, b) => s + n((accounts[b] || {}).cash), 0) + posCashAll;
    const marginAll = brokers.reduce((s, b) => s + n((accounts[b] || {}).margin), 0);
    const nlvAll = mktvlAll + cashAll;
    const elAll = nlvAll - marginAll;
    const blockTotalsAll = {};
    BLOCKS.forEach((b) => { blockTotalsAll[b.id] = positions.filter((p) => p.block === b.id).reduce((s, p) => s + capDesplegado(p), 0); });

    const lines = [];
    lines.push(`CARTERA — ${new Date().toLocaleDateString("es-ES")}`);
    lines.push("");
    lines.push("CUENTA (IBKR + DEGIRO)");
    lines.push(`MKT VL: $${money(mktvlAll)}`);
    lines.push(`NLV: $${money(nlvAll)}`);
    lines.push(`Cash: $${money(cashAll)}`);
    lines.push(`Margin: $${money(marginAll)}`);
    lines.push(`Excess Liquidity: $${money(elAll)}`);
    lines.push(`EL/NLV: ${pct(nlvAll ? elAll / nlvAll : NaN)}`);
    lines.push(`EL/Margin: ${pct(marginAll ? elAll / marginAll : NaN)}`);
    lines.push(`Apalancamiento MKT VL/NLV: ${nlvAll ? (mktvlAll / nlvAll).toFixed(2) : "—"}x`);
    lines.push("");

    BLOCKS.forEach((b) => {
      const bp = positions.filter((p) => p.block === b.id);
      const capTotal = bp.reduce((s, p) => s + capDesplegado(p), 0);
      const plausible = bp.reduce((s, p) => s + plausibleOf(p), 0);
      const pnl = bp.reduce((s, p) => s + effPnl(p), 0);
      lines.push(`${b.name} · ${b.tag} (objetivo ${pct(b.tMin, 0)}–${pct(b.tMax, 0)} NLV)`);
      lines.push(`  Riesgo total $${money(capTotal)} (${pct(nlvAll ? capTotal / nlvAll : NaN)} NLV) · Plausible $${money(plausible)} (${pct(nlvAll ? plausible / nlvAll : NaN)}) · P&L ${signMoney(pnl)}`);
      bp.forEach((p) => {
        const det = optionDetail(p);
        const natL = (NATS.find((x) => x.id === natOf(p)) || {}).label || natOf(p);
        lines.push(`  - ${p.tkr} [${p.broker}] ${natL}${p.tipo ? "/" + p.tipo : ""}${det ? " (" + det + ")" : ""} · Riesgo $${money2(capDesplegado(p))} · Plausible $${money2(plausibleOf(p))} · Margen $${money2(effMargen(p))}${isPctMargin(p) ? " (" + (p.margenPct || 0) + "%)" : ""} · BEP $${money2(effBep(p))} · Último ${p.last ? "$" + money2(p.last) : "—"} · P&L ${signMoney(effPnl(p))}${isAutoPnl(p) ? " (auto)" : ""}`);
      });
      lines.push("");
    });

    lines.push("EXPOSICIÓN POR SUBYACENTE (todas las posiciones agregadas por ticker)");
    const expMap = {};
    positions.forEach((p) => {
      if (!p.tkr) return;
      if (!expMap[p.tkr]) expMap[p.tkr] = { riesgo: 0, margen: 0 };
      expMap[p.tkr].riesgo += capDesplegado(p);
      expMap[p.tkr].margen += effMargen(p);
    });
    Object.entries(expMap).sort((a, b) => b[1].riesgo - a[1].riesgo).forEach(([tkr, v]) => {
      lines.push(`  ${tkr}: $${money(v.riesgo)} riesgo total · MKT VL ${pct(mktvlAll ? v.riesgo / mktvlAll : NaN)} · NLV ${pct(nlvAll ? v.riesgo / nlvAll : NaN)} · Margen ${pct(marginAll ? v.margen / marginAll : NaN)}`);
    });
    lines.push("");

    const totalRiesgoAll = positions.filter((p) => p.block !== 0).reduce((s, p) => s + capDesplegado(p), 0);
    const totalPnlAll = positions.reduce((s, p) => s + effPnl(p), 0);
    lines.push(`TOTAL RIESGO (sin B0): $${money(totalRiesgoAll)} · P&L TOTAL: ${signMoney(totalPnlAll)}`);
    return lines.join("\n");
  };
  const openExport = () => { setExportText(buildExportText()); setExportCopied(false); setExportOpen(true); };
  const copyExport = async () => {
    try { await navigator.clipboard.writeText(exportText); setExportCopied(true); }
    catch (e) { try { const el = document.getElementById("export-ta"); if (el) { el.focus(); el.select(); document.execCommand("copy"); setExportCopied(true); } } catch (e2) {} }
    setTimeout(() => setExportCopied(false), 2500);
  };

  /* ---------- snapshots de rendimiento: siempre sobre la cartera completa, no el filtro actual ---------- */
  const buildSnapshot = (posArg) => {
    const pos = posArg || positions;
    const mktvlAll = pos.reduce((s, p) => s + (isCashNat(p) ? 0 : effMkt(p)), 0);
    const posCashAll = pos.reduce((s, p) => s + (isCashNat(p) ? effMkt(p) : 0), 0);
    const cashAll = brokers.reduce((s, b) => s + n((accounts[b] || {}).cash), 0) + posCashAll;
    const marginAll = brokers.reduce((s, b) => s + n((accounts[b] || {}).margin), 0);
    const nlvAll = mktvlAll + cashAll;
    const elAll = nlvAll - marginAll;
    const blocks = {};
    BLOCKS.forEach((b) => {
      const bp = pos.filter((p) => p.block === b.id);
      blocks[b.id] = { riesgo: bp.reduce((s, p) => s + capDesplegado(p), 0), plausible: bp.reduce((s, p) => s + plausibleOf(p), 0), pnl: bp.reduce((s, p) => s + effPnl(p), 0) };
    });
    const tickers = {};
    pos.forEach((p) => {
      if (!p.tkr) return;
      if (!tickers[p.tkr]) tickers[p.tkr] = { riesgo: 0, pnl: 0 };
      tickers[p.tkr].riesgo += capDesplegado(p);
      tickers[p.tkr].pnl += effPnl(p);
    });
    return {
      date: new Date().toISOString().slice(0, 10),
      mktvl: mktvlAll, cash: cashAll, margin: marginAll, nlv: nlvAll, el: elAll,
      elNlv: nlvAll ? elAll / nlvAll : NaN, elMrgn: marginAll ? elAll / marginAll : NaN,
      leverage: nlvAll ? mktvlAll / nlvAll : NaN,
      totalRiesgo: pos.filter((p) => p.block !== 0).reduce((s, p) => s + capDesplegado(p), 0),
      totalPlausible: pos.filter((p) => p.block !== 0).reduce((s, p) => s + plausibleOf(p), 0),
      totalPnl: pos.reduce((s, p) => s + effPnl(p), 0),
      blocks, tickers,
    };
  };
  const saveSnapshot = () => {
    const snap = buildSnapshot();
    setSnapshots((ss) => [...ss.filter((s) => s.date !== snap.date), snap]);
  };
  const deleteSnapshot = (date) => setSnapshots((ss) => ss.filter((s) => s.date !== date));

  const addBroker = () => {
    const name = newBrokerName.trim().toUpperCase();
    if (!name || brokers.includes(name)) { setNewBrokerName(""); return; }
    setBrokers((bs) => [...bs, name]);
    setAccounts((a) => ({ ...a, [name]: emptyAcc() }));
    setNewBrokerName("");
  };
  const removeBroker = (name) => {
    if (brokers.length <= 1) return;
    const count = positions.filter((p) => p.broker === name).length;
    const dest = removeTarget[name] || brokers.find((b) => b !== name);
    if (count > 0 && dest) setPositions((ps) => ps.map((p) => (p.broker === name ? { ...p, broker: dest } : p)));
    setBrokers((bs) => bs.filter((b) => b !== name));
    setAccounts((a) => { const next = { ...a }; delete next[name]; return next; });
    setRemoveTarget((rt) => { const next = { ...rt }; delete next[name]; return next; });
    if (broker === name) setBroker("Todos");
  };

  return (
    <div ref={rootRef} style={{ minHeight: "100vh", background: T.bg, fontFamily: T.sans, color: T.ink, padding: "18px 14px 100px" }}>
      <style>{`
        input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
        input[type=number]{-moz-appearance:textfield;}
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        @keyframes pullSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      `}</style>
      {view === "bloques" && (pullDist > 0 || refreshing) && (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: refreshing ? 40 : pullDist, overflow: "hidden", transition: refreshing ? "height 0.15s" : "none", marginBottom: (pullDist > 0 || refreshing) ? 4 : 0 }}>
          <span style={{ fontSize: 20, display: "inline-block", animation: (refreshing || pullDist >= PULL_THRESHOLD) ? "pullSpin 0.8s linear infinite" : "none", opacity: Math.min((refreshing ? 1 : pullDist / PULL_THRESHOLD), 1) }}>🔄</span>
          <span style={{ fontSize: 11.5, fontWeight: 700, color: T.sub, marginLeft: 8 }}>{refreshing ? "Actualizando precios…" : pullDist >= PULL_THRESHOLD ? "Suelta para actualizar" : "Tira para actualizar precios"}</span>
        </div>
      )}
      <div style={{ maxWidth: 720, margin: "0 auto" }}>

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14, gap: 8 }}>
          <div>
            <div style={{ fontSize: 30, fontWeight: 800, letterSpacing: -0.8 }}>{view === "bloques" ? "Portfolio" : view === "movimientos" ? "Movimientos" : view === "vencimientos" ? "Vencimientos" : view === "ajustes" ? "Ajustes" : "Comparador"}</div>
            <div style={{ fontSize: 15, color: T.sub, fontWeight: 500 }}>{view === "bloques" ? "Composición de cartera en tiempo real" : view === "movimientos" ? "Primas y resultado realizado (MTM)" : view === "vencimientos" ? "Opciones por fecha y riesgo de asignación" : view === "ajustes" ? "Brokers, backup, claves y apariencia" : "Sizing e impacto de margen"}</div>
          </div>
          <div style={{ display: "flex", gap: 8, alignItems: "flex-start", flexWrap: "wrap", justifyContent: "flex-end" }}>
          </div>
        </div>

        {updateNotice && (
          <div style={{ background: T.tileGreen, borderRadius: 14, padding: "10px 12px", marginBottom: 12 }}>
            <div style={{ fontSize: 12.5, color: T.ink, fontWeight: 700, lineHeight: 1.45 }}>App actualizada a v{updateNotice.to} (antes {updateNotice.from}). Se guardó una copia automática de tus datos por seguridad.</div>
            <div style={{ fontSize: 11.5, color: T.sub, fontWeight: 500, lineHeight: 1.45, marginTop: 3 }}>Si tras la actualización algo no cuadra o faltan datos, restaura la copia desde Backup → Copias automáticas.</div>
            <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
              <button onClick={() => { setUpdateNotice(null); openBackup(); }} style={{ background: T.dark, border: "none", borderRadius: 10, padding: "7px 12px", fontSize: 12, fontWeight: 700, color: "#fff", cursor: "pointer" }}>Ver copias</button>
              <button onClick={() => setUpdateNotice(null)} style={{ background: "transparent", border: "none", borderRadius: 10, padding: "7px 10px", fontSize: 12, fontWeight: 700, color: T.sub, cursor: "pointer" }}>Todo OK</button>
            </div>
          </div>
        )}
        {refreshMsg && <div style={{ fontSize: 12, color: T.green, fontWeight: 700, marginBottom: 12, background: T.tileGreen, borderRadius: 12, padding: "8px 12px" }}>{refreshMsg}</div>}

        {/* SELECTOR BROKER */}
        {view !== "movimientos" && view !== "ajustes" && (
        <div style={{ display: "flex", gap: 8, marginBottom: 16, alignItems: "stretch" }}>
          <div style={{ background: T.dark, borderRadius: 18, padding: 6, display: "flex", gap: 6, flex: 1, overflowX: "auto" }}>
            {(brokers.length > 1 ? ["Todos", ...brokers] : brokers).map((b) => (
              <button key={b} onClick={() => setBroker(b)} style={{
                flex: "1 0 auto", border: "none", cursor: "pointer", borderRadius: 13, padding: "10px 14px", fontSize: 14, fontWeight: 700, whiteSpace: "nowrap",
                background: broker === b ? "#fff" : "transparent", color: broker === b ? T.dark : "#C4CCD4",
              }}>{b}</button>
            ))}
          </div>
        </div>
        )}

        {/* CUENTA */}
        {view !== "movimientos" && view !== "ajustes" && (
        <div style={{ background: T.card, borderRadius: 24, padding: 16, marginBottom: 16, boxShadow: T.shadow }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: T.sub, letterSpacing: 0.5, textTransform: "uppercase", marginBottom: 12 }}>
            Cuenta · {broker === "Todos" ? "consolidado" : broker}
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 9, marginBottom: 9 }}>
            <Tile label="MKT VL (suma bloques)" value={(mktvl < 0 ? "-$" : "$") + money(Math.abs(mktvl))} />
            <Tile label="NLV (MKTV + Cash)" value={(nlv < 0 ? "-$" : "$") + money(Math.abs(nlv))} tone={nlv > 0 ? "green" : "red"} />
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 9, marginBottom: 9 }}>
            {broker === "Todos" ? (
              <>
                <Tile label={"Cash (" + brokers.join(" + ") + ")"} value={(cash < 0 ? "-$" : "$") + money(Math.abs(cash))} />
                <Tile label={"Margin (" + brokers.join(" + ") + ")"} value={"$" + money(margin)} />
              </>
            ) : (
              <>
                <MoneyField label={"Cash manual · " + broker} value={(accounts[broker] || {}).cash} onChange={setAccField(broker, "cash")} signed />
                <MoneyField label={"Margin · " + broker} value={(accounts[broker] || {}).margin} onChange={setAccField(broker, "margin")} />
              </>
            )}
          </div>
          {posCash !== 0 && <div style={{ fontSize: 11, color: T.sub, marginBottom: 9, padding: "0 2px" }}>Cash = manual {(manualCash < 0 ? "-$" : "$") + money(Math.abs(manualCash))} + posiciones Cash B0 {(posCash < 0 ? "-$" : "$") + money(Math.abs(posCash))} → total {(cash < 0 ? "-$" : "$") + money(Math.abs(cash))}. Las posiciones Cash de B0 ya cuentan aquí (no en MKT VL): no las dupliques en el cash manual.</div>}
          {broker === "Todos" && <div style={{ fontSize: 11, color: T.sub, marginBottom: 9, padding: "0 2px" }}>Elige un broker arriba para editar su cash/margin. Toca ⚙ para añadir o quitar brokers.</div>}
          <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 9, marginBottom: 14 }}>
            <Tile label="Excess Liq (auto = NLV − Margin)" value={(el < 0 ? "-$" : "$") + money(Math.abs(el))} tone={el > 0 ? "green" : "red"} />
          </div>

          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", padding: "0 2px", marginBottom: 14 }}>
            <span style={{ fontSize: 12.5, color: T.sub, fontWeight: 600, display: "inline-flex", alignItems: "center", gap: 5 }}>Apalancamiento · MKT VL / NLV <InfoDot onClick={() => setInfo("leverage")} /></span>
            <span style={{ fontSize: 15, fontWeight: 800, color: T.ink }}>{isFinite(leverage) ? leverage.toFixed(2) + "×" : "—"}</span>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
            <div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
                <span style={{ fontSize: 13, color: T.ink, fontWeight: 700, display: "inline-flex", alignItems: "center", gap: 5 }}>EL / NLV <InfoDot onClick={() => setInfo("nlv")} /></span>
                <span style={{ fontSize: 17, fontWeight: 800, color: HEX[toneNlv(elNlv)] }}>{pct(elNlv)}</span>
              </div>
              <ZoneBar value={elNlv} min={0} max={0.6} zones={Z_NLV()} />
              <Scale min={0} max={0.6} marks={M_NLV_MINI} />
            </div>
            <div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
                <span style={{ fontSize: 13, color: T.ink, fontWeight: 700, display: "inline-flex", alignItems: "center", gap: 5 }}>EL / MRGN <InfoDot onClick={() => setInfo("mrgn")} /></span>
                <span style={{ fontSize: 17, fontWeight: 800, color: HEX[toneMrgn(elMrgn)] }}>{pct(elMrgn)}</span>
              </div>
              <ZoneBar value={elMrgn} min={0} max={1.5} zones={Z_MRGN()} />
              <Scale min={0} max={1.5} marks={M_MRGN_MINI} />
            </div>
          </div>
          <div style={{ display: "flex", gap: 16, marginTop: 12, fontSize: 11, color: T.sub, fontWeight: 600, flexWrap: "wrap" }}>
            {[["riesgo", T.red], ["ajustado", T.gold], ["saludable", T.green]].map(([txt, col]) => (
              <span key={txt} style={{ display: "inline-flex", alignItems: "center" }}>
                <span style={{ display: "inline-block", width: 9, height: 9, borderRadius: 3, background: col, marginRight: 6 }} />{txt}
              </span>
            ))}
          </div>
        </div>
        )}

        {view === "comparador" && (
          <ComparadorContent nlv={nlv} margin={margin} el={el} brokerLabel={broker === "Todos" ? "consolidado " + brokers.join(" + ") : broker}
            trades={trades} setTrades={setTrades} basis={basis} setBasis={setBasis} />
        )}

        {view === "bloques" && (<>
        {/* RESUMEN */}
        <div style={{ background: T.dark, borderRadius: 24, padding: 18, marginBottom: 16, color: "#fff", boxShadow: T.shadow, display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12 }}>
          <div>
            <div style={{ fontSize: 13, fontWeight: 700, color: "#B9C2CC", letterSpacing: 0.5, textTransform: "uppercase", display: "flex", alignItems: "center", gap: 5 }}>
              Riesgo total · P&L <InfoDot onClick={() => setInfo("riesgo")} />
            </div>
            <div style={{ fontSize: 13.5, color: "#DDE3E9", marginTop: 4 }}>{active.length} posiciones · ${money(totalRiesgo)} riesgo total</div>
          </div>
          <div style={{ fontSize: 26, fontWeight: 800, color: totalPnl >= 0 ? T.green : T.red, letterSpacing: -0.5, flexShrink: 0 }}>{signMoney(totalPnl)}</div>
        </div>

        {/* TABS: BLOQUES + EXPOSICIÓN */}
        <div style={{ display: "flex", gap: 6, marginBottom: 14, overflowX: "auto" }}>
          {TABS.map((t) => (
            <button key={t.id} onClick={() => selectTab(t.id)} style={{
              flex: "1 0 auto", border: "none", cursor: "pointer", borderRadius: 14, padding: "10px 12px", fontSize: 12.5, fontWeight: 800,
              background: activeTab === t.id ? t.color : T.card, color: activeTab === t.id ? "#fff" : T.ink,
              boxShadow: activeTab === t.id ? "none" : T.shadow, whiteSpace: "nowrap",
            }}>{t.label}</button>
          ))}
        </div>

        {/* CONTENIDO DE LA PESTAÑA */}
        {isBlockTab ? (
          <BlockCard blk={blk} positions={blockPositions} nlv={nlv} showPnl={showPnl} togglePnl={togglePnl} brokers={brokers}
            editSet={editSet} toggleEdit={toggleEdit} closeEdits={() => setEditSet(new Set())} setPos={setPos} addPos={addPos} delPos={delPos} rollPos={rollPos} closePos={closePos} reopenPos={reopenPos}
            onOpenSheet={openSheet} pendingAction={pendingAction} clearPending={() => setPendingAction(null)} coveredMap={coveredMap} />
        ) : activeTab === "rendimiento" ? (
          <RendimientoCard snapshots={snapshots} flows={flows} onSave={saveSnapshot} onDelete={deleteSnapshot} />
        ) : activeTab === "aportaciones" ? (
          <AportacionesCard flows={flows} setFlows={setFlows} brokers={brokers} />
        ) : (
          <ExposureCard rows={exposureRows} onOpen={setInfo} showPnl={showPnl} togglePnl={togglePnl} />
        )}

        {/* DISTRIBUCIÓN — debajo del contenido del bloque (no aplica en Rendimiento ni Aportaciones) */}
        {activeTab !== "rendimiento" && activeTab !== "aportaciones" && (
          <ChartCard scope={chartScope} setScope={setScopeAndReset} scopeOptions={scopeOptions} slices={chartData.slices} total={chartData.total} denomPct={chartData.denomPct} denomLabel={chartData.denomLabel} selected={selectedSlice} onSelect={setSelectedSlice} />
        )}

        </>)}

        {view === "vencimientos" && <VencimientosCard rows={vencimientosRows} onOpen={setInfo} />}

        {view === "movimientos" && <MovimientosView positions={filtered} reopenPos={reopenPos} />}

        {view === "ajustes" && (
          <div style={{ display: "grid", gap: 16 }}>
            <div style={{ background: T.card, borderRadius: 24, padding: 18, boxShadow: T.shadow }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: T.sub, letterSpacing: 0.5, textTransform: "uppercase", marginBottom: 12 }}>Precios</div>
              <button onClick={onRefreshClick} disabled={refreshing} style={{ width: "100%", background: T.tile, border: "none", borderRadius: 14, padding: "13px 0", fontSize: 14.5, fontWeight: 700, color: T.ink, cursor: "pointer" }}>{refreshing ? "Actualizando…" : "🔄 Actualizar precios"}</button>
            </div>

            <div style={{ background: T.card, borderRadius: 24, padding: 18, boxShadow: T.shadow }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: T.sub, letterSpacing: 0.5, textTransform: "uppercase", marginBottom: 12 }}>Apariencia</div>
              <button onClick={toggleDark} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", background: T.tile, border: "none", borderRadius: 14, padding: "13px 16px", fontSize: 14.5, fontWeight: 700, color: T.ink, cursor: "pointer" }}>
                <span>{isDark ? "Modo oscuro" : "Modo claro"}</span>
                <span style={{ fontSize: 20 }}>{isDark ? "🌙" : "☀️"}</span>
              </button>
            </div>

            <div style={{ background: T.card, borderRadius: 24, padding: 18, boxShadow: T.shadow }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: T.sub, letterSpacing: 0.5, textTransform: "uppercase", marginBottom: 12 }}>Brokers</div>
              <div style={{ fontSize: 12.5, color: T.sub, fontWeight: 500, lineHeight: 1.4, marginBottom: 10 }}>{brokers.join(" · ")}</div>
              <button onClick={() => { setBrokerModalOpen(true); setNewBrokerName(""); setRemoveTarget({}); }} style={{ width: "100%", background: T.tile, border: "none", borderRadius: 14, padding: "13px 0", fontSize: 14.5, fontWeight: 700, color: T.ink, cursor: "pointer" }}>⚙ Gestionar brokers (añadir / quitar)</button>
            </div>

            <div style={{ background: T.card, borderRadius: 24, padding: 18, boxShadow: T.shadow }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: T.sub, letterSpacing: 0.5, textTransform: "uppercase", marginBottom: 12 }}>Datos</div>
              <div style={{ display: "grid", gap: 10 }}>
                <button onClick={openExport} style={{ width: "100%", background: T.tile, border: "none", borderRadius: 14, padding: "13px 0", fontSize: 14.5, fontWeight: 700, color: T.ink, cursor: "pointer" }}>Exportar cartera</button>
                <button onClick={openBackup} style={{ width: "100%", background: T.tile, border: "none", borderRadius: 14, padding: "13px 0", fontSize: 14.5, fontWeight: 700, color: T.ink, cursor: "pointer" }}>Backup (copiar / restaurar)</button>
                <button onClick={clearAll} style={{ width: "100%", background: confirmClear ? T.red : T.tileRed, border: "none", borderRadius: 14, padding: "13px 0", fontSize: 14.5, fontWeight: 700, color: confirmClear ? "#fff" : T.red, cursor: "pointer" }}>{confirmClear ? "¿Seguro? Vacía toda la cartera" : "Limpiar cartera (Portfolio)"}</button>
                {trades.length > 0 && <button onClick={clearTrades} style={{ width: "100%", background: confirmClearTr ? T.red : T.tileRed, border: "none", borderRadius: 14, padding: "13px 0", fontSize: 14.5, fontWeight: 700, color: confirmClearTr ? "#fff" : T.red, cursor: "pointer" }}>{confirmClearTr ? "¿Seguro? Vacía el Comparador" : "Limpiar operaciones del Comparador"}</button>}
              </div>
            </div>

            <div style={{ background: T.card, borderRadius: 24, padding: 18, boxShadow: T.shadow }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: T.sub, letterSpacing: 0.5, textTransform: "uppercase", marginBottom: 12 }}>API keys</div>
              <div style={{ display: "grid", gap: 10 }}>
                <button onClick={openChangeKey} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", background: apiKey ? T.tile : T.tileAmber, border: "none", borderRadius: 14, padding: "13px 16px", fontSize: 14.5, fontWeight: 700, color: T.ink, cursor: "pointer" }}>
                  <span>Precios (Finnhub)</span>
                  <span style={{ fontSize: 12, color: T.sub, fontWeight: 700 }}>{apiKey ? "🔑 cambiar" : "🔑 activar"}</span>
                </button>
                <button onClick={openGeminiModal} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", background: geminiKey ? T.tile : T.tileAmber, border: "none", borderRadius: 14, padding: "13px 16px", fontSize: 14.5, fontWeight: 700, color: T.ink, cursor: "pointer" }}>
                  <span>Lector de capturas (Gemini, Comparador)</span>
                  <span style={{ fontSize: 12, color: T.sub, fontWeight: 700 }}>{geminiKey ? "🔑 cambiar" : "🔑 activar"}</span>
                </button>
              </div>
            </div>
          </div>
        )}

        <div style={{ textAlign: "center", fontSize: 14, fontWeight: 800, color: T.sub, letterSpacing: 0.3, margin: "22px 0 4px" }}>💸Galo Will Make You Rich💸</div>
        <div style={{ textAlign: "center", fontSize: 11, fontWeight: 700, color: T.sub, opacity: 0.7, marginBottom: 4 }}>
          v{APP_VERSION} · <button onClick={checkForNewerVersion} disabled={updChecking} style={{ background: "transparent", border: "none", fontSize: 11, fontWeight: 700, color: T.sub, textDecoration: "underline", cursor: "pointer", padding: 0 }}>{updChecking ? "comprobando…" : "buscar actualización"}</button>
        </div>
        {updCheckMsg && <div style={{ textAlign: "center", fontSize: 11, fontWeight: 600, color: T.sub, marginBottom: 10 }}>{updCheckMsg}</div>}
      </div>

      <InfoModal type={info} onClose={() => setInfo(null)} />
      {refreshChoiceOpen && (
        <div onClick={() => setRefreshChoiceOpen(false)} style={{ position: "fixed", inset: 0, background: "rgba(20,16,10,0.45)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 50, overflowY: "auto" }}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: T.card, borderRadius: 22, padding: 20, maxWidth: 380, width: "100%", boxShadow: "0 20px 50px rgba(0,0,0,0.3)", maxHeight: "calc(100vh - 40px)", overflowY: "auto", WebkitOverflowScrolling: "touch" }}>
            <div style={{ fontSize: 19, fontWeight: 800, color: T.ink, marginBottom: 6 }}>Precios (Finnhub)</div>
            <div style={{ fontSize: 13.5, color: T.sub, lineHeight: 1.5, marginBottom: 16 }}>Ya tienes una API key guardada en este dispositivo.</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              <button onClick={useSelectedKey} style={{ background: T.green, border: "none", borderRadius: 14, padding: "13px 0", fontSize: 15, fontWeight: 700, color: "#fff", cursor: "pointer", boxShadow: "0 4px 12px rgba(27,163,76,0.3)" }}>🔄 Actualizar precios</button>
              <button onClick={openChangeKey} style={{ background: T.tile, border: "none", borderRadius: 14, padding: "13px 0", fontSize: 15, fontWeight: 700, color: T.ink, cursor: "pointer" }}>🔑 Cambiar API key</button>
              <button onClick={() => setRefreshChoiceOpen(false)} style={{ background: "transparent", border: "none", borderRadius: 14, padding: "8px 0", fontSize: 14, fontWeight: 600, color: T.sub, cursor: "pointer" }}>Cancelar</button>
            </div>
          </div>

                      ))}
                      {(STRATS[wizBlock] || []).filter((s) => natFromStrat(s) === wizNat).length === 0 && (
                        <button onClick={() => { setWizStrat(wizNat === "ACC" ? "Long Stock" : wizNat === "CASH" ? "Cash" : ""); setWizStep(3); }} style={{ background: T.tile, border: "none", borderRadius: 20, padding: "10px 16px", fontSize: 13, fontWeight: 700, color: T.ink, cursor: "pointer" }}>Continuar</button>
                      )}
                    </div>
                  </div>
                )}
              </div>
            )}

            {wizStep === 3 && (
              <div style={{ display: "grid", gap: 10 }}>
                <div style={{ display: "flex", gap: 6, alignItems: "center", background: T.tile, borderRadius: 12, padding: "8px 12px" }}>
                  <span style={{ fontSize: 11.5, fontWeight: 700, color: T.sub }}>B{wizBlock} · {NATS.find((x) => x.id === wizNat)?.label}{wizStrat ? " · " + wizStrat : ""}</span>
                </div>
                {(wizStrat === "Covered Call" || wizStrat === "Collar") ? (() => {
                  /* covered call y collar: el subyacente se elige de las acciones abiertas de B1 — fija ticker
                     y broker, y deja el enlace (coveredBy) para el banner en B1 y el riesgo 0 del overlay */
                  const b1Stocks = positions.filter((x) => x.block === 1 && natOf(x) === "ACC" && !x.closed);
                  if (b1Stocks.length === 0) return (
                    <div style={{ display: "grid", gap: 8 }}>
                      <div style={{ background: T.tileAmber, borderRadius: 12, padding: "9px 12px", fontSize: 12, fontWeight: 700, color: T.gold }}>⚠️ No hay acciones abiertas en B1 que cubrir. Añade primero la acción, o escribe el ticker a mano.</div>
                      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                        <label style={{ display: "block", minWidth: 0 }}>
                    <div style={{ fontSize: 10.5, fontWeight: 700, color: T.sub, textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 5 }}>Broker</div>
                    <Pill options={brokers} value={wizForm.broker} onChange={wizF("broker")} size="sm" />
                  </label>
                        <WizInput label="Ticker" value={wizForm.tkr} onChange={wizF("tkr")} upper />
                      </div>
                    </div>
                  );
                  const optLabel = (s) => s.tkr + " · " + money(n(s.qty)) + " acc · BEP $" + money2(effBep(s)) + " · " + s.broker;
                  const opts = ["Elige la acción de B1…", ...b1Stocks.map(optLabel)];
                  const sel = b1Stocks.find((s) => s.id === wizForm.coveredStockId);
                  return (
                    <WizSelect label="Acción cubierta (Bloque 1)" value={sel ? optLabel(sel) : opts[0]}
                      onChange={(lbl) => { const st = b1Stocks.find((s) => optLabel(s) === lbl); if (st) setWizForm((f) => ({ ...f, coveredStockId: st.id, tkr: st.tkr, broker: st.broker })); }}
                      options={opts} />
                  );
                })() : (
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                  <label style={{ display: "block", minWidth: 0 }}>
                    <div style={{ fontSize: 10.5, fontWeight: 700, color: T.sub, textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 5 }}>Broker</div>
                    <Pill options={brokers} value={wizForm.broker} onChange={wizF("broker")} size="sm" />
                  </label>
                  <WizInput label="Ticker" value={wizForm.tkr} onChange={wizF("tkr")} upper />
                </div>

                        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                          <WizInput label="Riesgo plausible %" value={wizForm.plausible} onChange={wizF("plausible")} inputMode="numeric" />
                          <WizInput label="Fecha de entrada" value={wizForm.entryDate} onChange={wizF("entryDate")} type="date" />
                        </div>
                      </>
